<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabras Neo — Homologação V1.1</title><style>
:root{--navy:#0b2340;--blue:#2167d7;--bg:#f4f7fb;--line:#dfe6ef;--text:#1a2433;--muted:#718096;--green:#16855f;--amber:#b87817;--red:#c84343}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;padding:8px 10px 20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe6f3;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#1f5fb2;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.titlebar h1{margin:0;font-size:28px}.titlebar p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collap x-wrap:wrap;margin-bottom:14px}.subnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.subnav button.on{background:#e9f1ff;color:#1557b7;border-color:#cfe0ff}.warn{padding:10px;border-radius:10px;background:#fff7e8;color:#875816;margin-bottom:8px}.dangerbox{padding:10px;border-radius:10px;background:#fff0f0;color:#a22f2f;margin-bottom:8px}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand{font-size:0}.brand:before{content:'JN';font-size:18px}.nav button{font-size:0}.nav button:before{content:attr(data-i);font-size:18px}.cards{grid-template-columns:1fr 1fr}.grid3,.grid2{grid-template-columns:1fr}.drawer{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">JABRAS NEO<small>Homologação V1.1</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><b id="crumb">Dashboard</b><div><select class="btn"><option>Português</option><option>日本語</option></select> <span class="badge green">HOMOLOGAÇÃO</span></div></header><div class="content" id="view"></div></main></div><div class="drawerbg" id="drawerbg"></div><aside class="drawer" id="drawer"><div class="drawerhead"><div id="drawerTitle"></div><button class="close" id="drawerClose">×</button></div><div class="drawerbody" id="drawerBody"></div><div class="drawerfoot" id="drawerFoot"></div></aside><script>
const K='jabras_homolog_v11';const seed={clients:[{id:'c1',name:'JTEKT'}],factories:[{id:'f1',clientId:'c1',name:'岡崎',code:'岡'},{id:'f2',clientId:'c1',name:'花園',code:'花'}],sectors:[{id:'s1',factoryId:'f1',name:'物流課'}],shifts:[{id:'b1',factoryId:'f1',name:'A班',day:'06:25-15:05',night:'16:10-00:50'}],banks:[{id:'bk1',name:'三菱UFJ銀行',code:'0005'}],branches:[{id:'br1',bankId:'bk1',name:'岡崎支店',code:'718'}],nationalities:[{id:'n1',name:'Brasil',ja:'ブラジル',lang:'Português'}],docTypes:[{id:'dt1',name:'Cartão de Residência',ja:'在留カード'}],occTypes:[{id:'ot1',name:'Advertência escrita',ja:'書面注意'}],terminationReasons:[{id:'tr1',name:'Pedido de demissão',ja:'自己都合退職'}],dorms:[{id:'h1',name:'ハイツ一番地101',address:'岡崎市中町1丁目1-7',capacity:2,mode:'single',rent:44550,fee:5000,perPerson:0,keys:3,appliances:[{type:'冷蔵庫',control:'G005'},{type:'洗濯機',control:'M005'},{type:'コンロ',control:'FP005'}],utilities:{electric:{on:true,onDate:'2026-04-01',note:''},gas:{on:true,onDate:'2026-04-01',note:'立ち合い必要'},water:{on:true,onDate:'2026-04-01',note:''}}}],employees:[{id:'e1',name:'カルロス・シルバ',kana:'カルロス・シルバ',romaji:'CARLOS SILVA',empNo:'1024',jtektNo:'45128',factoryId:'f1',sectorId:'s1',shiftId:'b1',work:'夜勤',status:'active',phone:'090-1234-5678',email:'carlos@example.com',emergency:{name:'Maria Silva',relation:'妻',phone:'090-0000-0000',address:'岡崎市'},dormId:'h1',social:{status:'加入中',join:'2026-04-01',symbol:'123',number:'456789',pension:'1234-567890'},employment:{status:'加入中',join:'2026-04-01',number:'1234-567890-1',loss:''},bank:{bankId:'bk1',branchId:'br1',type:'普通',account:'0012345',holder:'カルロス シルバ'},vehicle:{maker:'Toyota',model:'Prius',plate:'岡崎300あ12-34',active:true,shaken:'2027-01-20',hoken:'2027-03-31'},dependents:[{name:'Maria Silva',relation:'配偶者',birth:'1990-05-10',social:true}],docs:[{typeId:'dt1',number:'AB123456',expiry:'2026-09-20'}],history:[{date:'2026-08-18',text:'Telefone alterado'}]}],yukyu:[{employeeId:'e1',lots:[{acq:'2025-09-24',expire:'2027-09-23',granted:10,used:5},{acq:'2026-09-24',expire:'2028-09-23',granted:11,used:0}],forecast:[{date:'2026-09-10',status:'open'}]}]};let db=load(),page='dashboard',empTab='data',masterType='clients';function load(){try{return JSON.parse(localStorage.getItem(K))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(K,JSON.stringify(db))}function id(p){return p+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function v(i){return document.getElementById(i)?.value??''}function by(a,k,x){return a.find(o=>o[k]===x)}function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}const pages=[['dashboard','▦','Dashboard'],['employees','👥','Funcionários'],['yukyu','休','有休管理'],['dorms','⌂','社宅管理'],['masters','⚙','Cadastros Mestres'],['settings','☷','Configurações']];function navRender(){nav.innerHTML=pages.map(p=>`<button data-i="${p[1]}" class="${page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]} ${p[2]}</button>`).join('')}function go(p){page=p;navRender();render()}function openDrawer(t,b,f=''){drawerTitle.innerHTML=t;drawerBody.innerHTML=b;drawerFoot.innerHTML=f;drawerbg.classList.add('show');drawer.classList.add('show')}function closeDrawer(){drawerbg.classList.remove('show');drawer.classList.remove('show')}drawerClose.onclick=closeDrawer;drawerbg.onclick=closeDrawer;function render(){crumb.textContent=pages.find(x=>x[0]===page)?.[2]||'';({dashboard:dash,employees:employees,yukyu:yukyu,dorms:dorms,masters:masters,settings:settings}[page])()}function dash(){view.innerHTML=`<div class="titlebar"><div><h1>Dashboard</h1><p>Homologação V1.1</p></div></div><div class="cards"><div class="card">Funcionários<b>${db.employees.length}</b></div><div class="card">Fábricas<b>${db.factories.length}</b></div><div class="card">社宅<b>${db.dorms.length}</b></div><div class="card">Cadastros<b>${db.clients.length+db.banks.length+db.docTypes.length}</b></div></div><div class="panel"><h3>Alterações desta versão</h3><p>✓ Navegação padronizada por drawers laterais.</p><p>✓ Ficha do funcionário com as 9 abas.</p><p>✓ 雇用保険 separado de 社会保険.</p><p>✓ Trabalho usa 班 + 勤務, sem 勤務形態 redundante.</p></div>`}function employees(){view.innerHTML=`<div class="titlebar"><div><h1>Funcionários</h1><p>Clique em uma linha para abrir o drawer completo.</p></div><button class="btn primary" onclick="newEmployee()">+ Novo funcionário</button></div><div class="tablewrap"><table class="table"><thead><tr><th>名前 / フリガナ</th><th>社員番号</th><th>JTEKT社員番号</th><th>Fábrica</th><th>Status</th></tr></thead><tbody>${db.employees.map(e=>`<tr onclick="openEmployee('${e.id}')"><td><b>${esc(e.name)}</b><div class="muted">${esc(e.kana)}</div></td><td>${esc(e.empNo)}</td><td>${esc(e.jtektNo)}</td><td>${esc(by(db.factories,'id',e.factoryId)?.name||'—')}</td><td><span class="badge green">${e.status==='active'?'Ativo':'Pré-cadastro'}</span></td></tr>`).join('')}</tbody></table></div>`}const tabs=[['data','👤 Dados'],['work','💼 Trabalho'],['housing','🏠 Moradia'],['docs','📄 Documentos'],['insurance','🛡️ Seguros'],['payment','💰 Pagamento'],['vehicle','🚗 Veículo'],['dependents','👨‍👩‍👧 Dependentes'],['history','📋 Histórico']];function openEmployee(eid){let e=by(db.employees,'id',eid);openDrawer(`<div><h2 style="margin:0">${esc(e.name)}</h2><div class="muted">社員番号 ${esc(e.empNo)} · JTEKT社員番号 ${esc(e.jtektNo||'—')}</div></div>`,`<div class="tabs">${tabs.map(t=>`<button class="${empTab===t[0]?'on':''}" onclick="empTab='${t[0]}';openEmployee('${eid}')">${t[1]}</button>`).join('')}</div>${empContent(e)}`,`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveEmployee('${eid}')">Salvar</button>`)}function empContent(e){if(empTab==='data')return `<div class="grid2"><F l="名前"><input id="en" value="${esc(e.name)}"></F><F l="名前（ローマ字）"><input id="er" value="${esc(e.romaji||'')}"></F><F l="フリガナ"><input id="ek" value="${esc(e.kana||'')}"></F><F l="社員番号"><input id="eno" value="${esc(e.empNo)}"></F><F l="Telefone"><input id="ep" value="${esc(e.phone||'')}"></F><F l="E-mail"><input id="ee" value="${esc(e.email||'')}"></F></div><div class="section"><h3>Contato de emergência</h3><div class="grid2"><F l="Nome"><input id="ecn" value="${esc(e.emergency?.name||'')}"></F><F l="Relação"><input id="ecr" value="${esc(e.emergency?.relation||'')}"></F><F l="Telefone"><input id="ecp" value="${esc(e.emergency?.phone||'')}"></F><F l="Endereço"><input id="eca" value="${esc(e.emergency?.address||'')}"></F></div></div>`;if(empTab==='work')return `<div class="grid2"><F l="Fábrica"><select id="ef">${db.factories.map(f=>`<option value="${f.id}" ${e.factoryId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></F><F l="Setor"><select id="es"><option value="">—</option>${db.sectors.filter(s=>s.factoryId===e.factoryId).map(s=>`<option value="${s.id}" ${e.sectorId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="btn" onclick="quickMaster('sectors','${eid}')">+ Setor</button></F><F l="班"><select id="eb"><option value="">—</option>${db.shifts.filter(s=>s.factoryId===e.factoryId).map(s=>`<option value="${s.id}" ${e.shiftId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></F><F l="勤務"><select id="ew"><option ${e.work==='昼勤'?'selected':''}>昼勤</option><option ${e.work==='夜勤'?'selected':''}>夜勤</option><option ${e.work==='常昼'?'selected':''}>常昼</option><option ${e.work==='常夜'?'selected':''}>常夜</option></select></F><F l="JTEKT社員番号"><input id="ej" value="${esc(e.jtektNo||'')}"></F><F l="Responsável no cliente"><input id="ecl" value="${esc(e.clientResp||'')}"></F></div>`;if(empTab==='housing'){let d=by(db.dorms,'id',e.dormId);return `<div class="panel"><h3>Moradia atual</h3>${d?`<b>${esc(d.name)}</b><p>${esc(d.address)}</p><p>Valor base: ${yen(d.rent+d.fee)}</p><button class="btn" onclick="openDorm('${d.id}')">Abrir 社宅</button>`:'<span class="muted">自宅 / sem 社宅 vinculado</span>'}</div>`}if(empTab==='docs')return `<h3>Documentos</h3><table class="table"><thead><tr><th>Tipo</th><th>Número</th><th>Validade</th></tr></thead><tbody>${(e.docs||[]).map(d=>`<tr><td>${esc(by(db.docTypes,'id',d.typeId)?.ja||'')}</td><td>${esc(d.number)}</td><td>${esc(d.expiry)}</td></tr>`).join('')}</tbody></table>`;if(empTab==='insurance')return `<div class="grid2"><div class="panel"><h3>社会保険</h3><F l="Status"><select id="ss">${st(e.social?.status)}</select></F><F l="社会保険加入日"><input type="date" id="sj" value="${e.social?.join||''}"></F><div class="grid2"><F l="健康保険記号"><input id="sy" value="${esc(e.social?.symbol||'')}"></F><F l="健康保険番号"><input id="sn" value="${esc(e.social?.number||'')}"></F></div><F l="基礎年金番号"><input id="sp" value="${esc(e.social?.pension||'')}"></F></div><div class="panel"><h3>雇用保険</h3><F l="Status"><select id="ks">${st(e.employment?.status)}</select></F><F l="雇用保険被保険者番号"><input id="kn" value="${esc(e.employment?.number||'')}"></F><div class="grid2"><F l="加入日"><input type="date" id="kj" value="${e.employment?.join||''}"></F><F l="喪失日"><input type="date" id="kl" value="${e.employment?.loss||''}"></F></div></div></div>`;if(empTab==='payment')return `<div class="grid2"><F l="Banco"><select id="pb"><option value="">—</option>${db.banks.map(b=>`<option value="${b.id}" ${e.bank?.bankId===b.id?'selected':''}>${esc(b.name)} ${esc(b.code)}</option>`).join('')}</select></F><F l="Agência"><select id="pbr"><option value="">—</option>${db.branches.map(b=>`<option value="${b.id}" ${e.bank?.branchId===b.id?'selected':''}>${esc(b.name)} ${esc(b.code)}</option>`).join('')}</select></F><F l="Tipo"><input id="pt" value="${esc(e.bank?.type||'普通')}"></F><F l="Conta"><input id="pa" value="${esc(e.bank?.account||'')}"></F><F l="Titular"><input id="ph" value="${esc(e.bank?.holder||'')}"></F></div>`;if(empTab==='vehicle')return `<div class="grid2"><F l="Fabricante"><input id="vm" value="${esc(e.vehicle?.maker||'')}"></F><F l="Modelo"><input id="vmo" value="${esc(e.vehicle?.model||'')}"></F><F l="Placa"><input id="vp" value="${esc(e.vehicle?.plate||'')}"></F><F l="車検"><input type="date" id="vs" value="${e.vehicle?.shaken||''}" ${e.vehicle?.active===false?'disabled':''}></F><F l="任意保険"><input type="date" id="vh" value="${e.vehicle?.hoken||''}" ${e.vehicle?.active===false?'disabled':''}></F></div>${e.vehicle?.active===false?'<div class="warn">Veículo encerrado. 車検 e 任意保険 não geram pendências.</div>':'<button class="btn danger" onclick="endVehicle(\''+e.id+'\')">Venda / Encerrar uso</button>'}`;if(empTab==='dependents')return `<h3>Familiares e Dependentes</h3><table class="table"><thead><tr><th>Nome</th><th>Relação</th><th>Nascimento</th><th>社保扶養</th></tr></thead><tbody>${(e.dependents||[]).map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.relation)}</td><td>${esc(d.birth)}</td><td>${d.social?'Sim':'Não'}</td></tr>`).join('')}</tbody></table>`;return `<h3>Histórico</h3>${(e.history||[]).map(h=>`<div class="panel" style="margin-bottom:8px"><b>${esc(h.date)}</b><div>${esc(h.text)}</div></div>`).join('')}`}function st(s){return ['未加入','加入手続中','加入中','喪失手続中','喪失済'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}customElements.define('f',class extends HTMLElement{connectedCallback(){this.className='field';this.innerHTML=`<label>${this.getAttribute('l')}</label>`+this.innerHTML}});function saveEmployee(eid){let e=by(db.employees,'id',eid);if(document.getElementById('en')){e.name=v('en');e.romaji=v('er');e.kana=v('ek');e.empNo=v('eno');e.phone=v('ep');e.email=v('ee');e.emergency={name:v('ecn'),relation:v('ecr'),phone:v('ecp'),address:v('eca')}}if(document.getElementById('ef')){e.factoryId=v('ef');e.sectorId=v('es');e.shiftId=v('eb');e.work=v('ew');e.jtektNo=v('ej');e.clientResp=v('ecl')}if(document.getElementById('ss')){e.social={status:v('ss'),join:v('sj'),symbol:v('sy'),number:v('sn'),pension:v('sp')};e.employment={status:v('ks'),number:v('kn'),join:v('kj'),loss:v('kl')}}if(document.getElementById('pb'))e.bank={bankId:v('pb'),branchId:v('pbr'),type:v('pt'),account:v('pa'),holder:v('ph')};if(document.getElementById('vm'))Object.assign(e.vehicle,{maker:v('vm'),model:v('vmo'),plate:v('vp'),shaken:v('vs'),hoken:v('vh')});e.history=e.history||[];e.history.unshift({date:new Date().toISOString().slice(0,10),text:'Cadastro atualizado'});save();openEmployee(eid)}function newEmployee(){let next=Math.max(0,...db.employees.map(e=>+e.empNo||0))+1;openDrawer('<h2 style="margin:0">Novo funcionário</h2>',`<div class="grid2"><F l="名前 *"><input id="nn"></F><F l="社員番号 *"><input id="nno" value="${next}"></F><F l="Fábrica"><select id="nf"><option value="">—</option>${db.factories.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></F></div>`,`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createEmployee()">Cadastrar</button>`)}function createEmployee(){let no=v('nno');if(db.employees.some(e=>e.empNo===no)){alert('社員番号 já está em uso. Próximo disponível: '+(Math.max(...db.employees.map(e=>+e.empNo||0))+1));return}let e={id:id('e'),name:v('nn'),empNo:no,factoryId:v('nf'),status:'draft',social:{status:'未加入'},employment:{status:'未加入'},vehicle:{active:true},dependents:[],docs:[],history:[]};db.employees.push(e);save();closeDrawer();employees();openEmployee(e.id)}function endVehicle(eid){if(confirm('Encerrar uso?')){let e=by(db.employees,'id',eid);e.vehicle.active=false;save();openEmployee(eid)}}function yukyu(){view.innerHTML=`<div class="titlebar"><div><h1>有休管理</h1><p>Visão administrativa por funcionário.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Funcionário</th><th>Saldo</th><th>Próxima folga</th></tr></thead><tbody>${db.employees.map(e=>{let y=db.yukyu.find(x=>x.employeeId===e.id)||{lots:[],forecast:[]},bal=y.lots.reduce((s,l)=>s+l.granted-l.used,0);return `<tr onclick="openY('${e.id}')"><td>${esc(e.name)}</td><td>${bal} dias</td><td>${y.forecast?.find(f=>f.status==='open')?.date||'—'}</td></tr>`}).join('')}</tbody></table></div>`}function openY(eid){let e=by(db.employees,'id',eid),y=db.yukyu.find(x=>x.employeeId===eid)||{employeeId:eid,lots:[],forecast:[]};if(!db.yukyu.includes(y))db.yukyu.push(y);openDrawer(`<h2 style="margin:0">有休 — ${esc(e.name)}</h2>`,`<h3>Lotes</h3><table class="table"><thead><tr><th>Aquisição</th><th>Validade</th><th>Recebido</th><th>Usado</th><th>Saldo</th></tr></thead><tbody>${y.lots.slice().reverse().map(l=>`<tr><td>${l.acq}</td><td>${l.expire}</td><td>${l.granted}</td><td>${l.used}</td><td>${l.granted-l.used}</td></tr>`).join('')}</tbody></table><div class="warn">Consumo sempre pelo lote mais recente.</div>`,`<button class="btn" onclick="closeDrawer()">Fechar</button>`)}function dorms(){view.innerHTML=`<div class="titlebar"><div><h1>社宅管理</h1><p>Lista de imóveis.</p></div><button class="btn primary" onclick="newDorm()">+ Novo 社宅</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Imóvel</th><th>Endereço</th><th>Capacidade</th><th>Moradores</th><th>Custo base</th><th>Serviços</th></tr></thead><tbody>${db.dorms.map(d=>`<tr onclick="openDorm('${d.id}')"><td><b>${esc(d.name)}</b></td><td>${esc(d.address)}</td><td>${d.mode==='single'?'1 (individual)':d.capacity}</td><td>${db.employees.filter(e=>e.dormId===d.id).length}</td><td>${yen(d.rent+d.fee)}</td><td>⚡${d.utilities.electric.on?'●':'○'} 🔥${d.utilities.gas.on?'●':'○'} 💧${d.utilities.water.on?'●':'○'}</td></tr>`).join('')}</tbody></table></div>`}function openDorm(did){let d=by(db.dorms,'id',did);openDrawer(`<div><h2 style="margin:0">${esc(d.name)}</h2><div class="muted">${esc(d.address)}</div></div>`,`<div class="grid3"><div class="panel"><h3>Custos</h3><div>家賃 ${yen(d.rent)}</div><div>Encargo ${yen(d.fee)}</div><b>Total ${yen(d.rent+d.fee)}</b></div><div class="panel"><h3>Ocupação</h3><div>${d.mode==='single'?'Individual':'Compartilhado'}</div><div>Chaves: ${d.keys}</div></div><div class="panel"><h3>Moradores</h3>${db.employees.filter(e=>e.dormId===did).map(e=>`<div>${esc(e.name)}</div>`).join('')||'Vazio'}</div></div><h3>備品・家電</h3><table class="table"><thead><tr><th>Tipo</th><th>Nº controle</th></tr></thead><tbody>${d.appliances.map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.control)}</td></tr>`).join('')}</tbody></table><h3>電気・ガス・水道</h3><div class="grid3">${['electric','gas','water'].map(k=>`<div class="panel"><b>${{electric:'⚡ 電気',gas:'🔥 ガス',water:'💧 水道'}[k]}</b><div>${d.utilities[k].on?'Ligado':'Desligado'}</div><div>${d.utilities[k].onDate||'—'}</div><div class="muted">${esc(d.utilities[k].note||'')}</div></div>`).join('')}</div>`,`<button class="btn" onclick="closeDrawer()">Fechar</button>`)}function newDorm(){openDrawer('<h2 style="margin:0">Novo 社宅</h2>',`<div class="grid2"><F l="Nome"><input id="dn"></F><F l="Endereço"><input id="da"></F><F l="Capacidade"><input type="number" id="dc" value="1"></F><F l="家賃"><input type="number" id="dr"></F><F l="Encargo"><input type="number" id="df"></F></div>`,`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createDorm()">Cadastrar</button>`)}function createDorm(){db.dorms.push({id:id('h'),name:v('dn'),address:v('da'),capacity:+v('dc'),mode:'shared',rent:+v('dr'),fee:+v('df'),perPerson:0,keys:1,appliances:[],utilities:{electric:{on:false},gas:{on:false},water:{on:false}}});save();closeDrawer();dorms()}const defs={clients:['Clientes','name'],factories:['Fábricas','name'],sectors:['Setores','name'],shifts:['班','name'],banks:['Bancos','name'],branches:['Agências','name'],nationalities:['Nacionalidades','name'],docTypes:['Tipos de Documento','name'],occTypes:['Tipos de Ocorrência','name'],terminationReasons:['Motivos de Desligamento','name']};function masters(){view.innerHTML=`<div class="titlebar"><div><h1>Cadastros Mestres</h1><p>Todos os itens abaixo podem ser cadastrados e editados.</p></div><button class="btn primary" onclick="masterNew('${masterType}')">+ Novo</button></div><div class="subnav">${Object.entries(defs).map(([k,d])=>`<button class="${masterType===k?'on':''}" onclick="masterType='${k}';masters()">${d[0]}</button>`).join('')}</div><div class="tablewrap"><table class="table"><thead><tr><th>${defs[masterType][0]}</th><th>Ação</th></tr></thead><tbody>${db[masterType].map(x=>`<tr onclick="masterEdit('${masterType}','${x.id}')"><td><b>${esc(x[defs[masterType][1]])}</b></td><td>Editar</td></tr>`).join('')}</tbody></table></div>`}function masterNew(type){openDrawer(`<h2 style="margin:0">Novo — ${defs[type][0]}</h2>`,masterForm(type,{}),`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="masterSave('${type}','')">Cadastrar</button>`)}function masterEdit(type,mid){openDrawer(`<h2 style="margin:0">Editar — ${defs[type][0]}</h2>`,masterForm(type,by(db[type],'id',mid)),`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="masterSave('${type}','${mid}')">Salvar</button>`)}function masterForm(type,x){let h=`<F l="Nome"><input id="mn" value="${esc(x[defs[type][1]]||'')}"></F>`;if(type==='factories')h+=`<F l="Cliente"><select id="mp">${db.clients.map(c=>`<option value="${c.id}" ${x.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></F><F l="Código curto"><input id="mc" value="${esc(x.code||'')}"></F>`;if(type==='sectors'||type==='shifts')h+=`<F l="Fábrica"><select id="mp">${db.factories.map(f=>`<option value="${f.id}" ${x.factoryId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></F>`;if(type==='banks'||type==='branches')h+=`<F l="Código"><input id="mc" value="${esc(x.code||'')}"></F>`;if(type==='branches')h+=`<F l="Banco"><select id="mp">${db.banks.map(b=>`<option value="${b.id}" ${x.bankId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></F>`;return h}function masterSave(type,mid){let key=defs[type][1],x=mid?by(db[type],'id',mid):{id:id(type[0])};x[key]=v('mn');if(type==='factories'){x.clientId=v('mp');x.code=v('mc')}if(type==='sectors'||type==='shifts')x.factoryId=v('mp');if(type==='banks')x.code=v('mc');if(type==='branches'){x.bankId=v('mp');x.code=v('mc')}if(!mid)db[type].push(x);save();closeDrawer();masters()}function quickMaster(type,eid){masterType=type;closeDrawer();go('masters');masterNew(type)}function settings(){view.innerHTML=`<div class="titlebar"><div><h1>Configurações</h1><p>Persistência local da homologação.</p></div></div><div class="panel"><p>Os dados ficam salvos neste navegador.</p><button class="btn" onclick="exportData()">Exportar JSON</button> <button class="btn danger" onclick="resetData()">Restaurar teste</button></div>`}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jabras-homologacao.json';a.click()}function resetData(){if(confirm('Restaurar dados?')){db=structuredClone(seed);save();render()}}navRender();render();
</script></body></html>
