<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabras Neo — Homologação V1</title><style>
:root{--navy:#0b2340;--blue:#2167d7;--bg:#f4f7fb;--line:#dfe6ef;--text:#1a2433;--muted:#718096;--green:#16855f;--amber:#b87817;--red:#c84343;--shadow:0 20px 60px #0b234033}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;padding:8px 10px 20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe6f3;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#1f5fb2;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.titlebar h1{margin:0;font-size:28px}.titlebar p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted)}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-top:1px solid var(--line);text-align:left}.table th{background:#f8fafc;color:var(--muted);font-size:12px}.table tbody tr.click{cursor:pointer}.table tbody tr.click:hover{background:#f8fbff}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.green{background:#e8f6ef;color:var(--green)}.amber{background:#fff2dc;color:var(--amber)}.red{background:#fdeaea;color:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:78px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.backdrop{position:fixed;inset:0;background:#00152d70;opacity:0;pointer-events:none;transition:.2s;z-index:30}.backdrop.show{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(1120px,90vw);background:#fff;z-index:31;transform:translateX(103%);transition:.25s;box-shadow:var(--shadow);display:flex;flex-direction:column}.drawer.show{transform:none}.drawerHead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.drawerHead h2{margin:0}.drawerBody{padding:20px 22px;overflow:auto}.drawerFoot{margin-top:auto;padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:#eef2f7;border-radius:9px;width:38px;height:38px;cursor:pointer}.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);padding:0 4px}.tabs button{border:0;background:none;padding:13px 12px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.on{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.notice{padding:10px 12px;border-radius:10px;background:#fff7e8;color:#875816;margin:10px 0}.rowActions{display:flex;gap:6px}.mini{padding:6px 9px}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand{font-size:0}.brand:before{content:'JN';font-size:18px}.nav button{font-size:0}.nav button:before{content:attr(data-i);font-size:18px}.cards,.grid3,.grid2{grid-template-columns:1fr}.drawer{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">JABRAS NEO<small>Homologação V1</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><b id="crumb">Dashboard</b><div><span class="badge green">HOMOLOGAÇÃO</span></div></header><div class="content" id="view"></div></main></div><div class="backdrop" id="backdrop" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"><div class="drawerHead"><h2 id="drawerTitle">Detalhes</h2><button class="close" onclick="closeDrawer()">✕</button></div><div class="tabs" id="drawerTabs"></div><div class="drawerBody" id="drawerBody"></div><div class="drawerFoot" id="drawerFoot"></div></aside><script>
const KEY='jabras_homolog_v1_4';const seed={clients:[{id:'c1',name:'JTEKT'}],factories:[{id:'f1',clientId:'c1',name:'岡崎',code:'岡'},{id:'f2',clientId:'c1',name:'花園',code:'花'}],sectors:[{id:'s1',factoryId:'f1',name:'物流課'}],shifts:[{id:'b1',factoryId:'f1',name:'A班',dayStart:'06:25',dayEnd:'15:05',nightStart:'16:10',nightEnd:'00:50'}],banks:[{id:'bk1',name:'三菱UFJ銀行',code:'0005'}],branches:[{id:'br1',bankId:'bk1',name:'岡崎支店',code:'718'}],docTypes:[{id:'d1',pt:'Cartão de Residência',ja:'在留カード'}],dorms:[{id:'h1',name:'ハイツ一番地101',postal:'444-0015',address:'岡崎市中町1丁目1-7',capacity:2,mode:'single',rent:44550,fee:5000,perPerson:0,keys:3,parking:1,appliances:[{type:'冷蔵庫',control:'G005'},{type:'洗濯機',control:'M005'},{type:'コンロ',control:'FP005'},{type:'照明',control:'L015'}],utilities:{electric:{on:true,onDate:'2026-04-01',offDate:'',note:''},gas:{on:true,onDate:'2026-04-01',offDate:'',note:'立ち合い必要'},water:{on:true,onDate:'2026-04-01',offDate:'',note:''}}}],employees:[{id:'e1',name:'Carlos Silva',kana:'カルロス・シルバ',romaji:'CARLOS SILVA',empNo:'1024',jtektNo:'45128',factoryId:'f1',sectorId:'s1',shiftId:'b1',work:'夜勤',status:'active',phone:'090-1234-5678',email:'carlos@example.com',address:'岡崎市中町1丁目1-7',dormId:'h1',bankId:'bk1',branchId:'br1',account:'1234567',social:{status:'加入中',join:'2026-04-01',symbol:'123',number:'456789',pension:'1234-567890'},employment:{status:'加入中',number:'1234-567890-1',join:'2026-04-01',loss:''},vehicle:{maker:'Toyota',model:'Prius',plate:'岡崎 300 あ 12-34',active:true,shaken:'2027-01-20',hoken:'2027-03-31'},dependents:[{id:'dep1',name:'Maria Silva',relation:'配偶者',birth:'1990-04-12',social:true}],documents:[{id:'doc1',type:'在留カード',validUntil:'2028-05-31'}],history:[{date:'2026-04-01',text:'Admissão cadastrada'}]}],yukyu:[{employeeId:'e1',lots:[{id:'y1',acq:'2025-09-24',expire:'2027-09-23',granted:10,used:5},{id:'y2',acq:'2026-09-24',expire:'2028-09-23',granted:11,used:0}],forecast:[{date:'2026-09-10',status:'open'}]}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed),page='dashboard';const $=id=>document.getElementById(id),by=(a,id)=>a.find(x=>x.id===id),uid=p=>p+Math.random().toString(36).slice(2,9),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),fmt=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),v=id=>$(id)?.value??'',c=id=>!!$(id)?.checked;
const pages=[['dashboard','▦','Dashboard'],['employees','👥','Funcionários'],['yukyu','休','有休管理'],['dorms','⌂','社宅管理'],['masters','⚙','Cadastros Mestres']];const empTabs=[['dados','👤 Dados'],['trabalho','💼 Trabalho'],['moradia','🏠 Moradia'],['documentos','📄 Documentos'],['seguros','🛡️ Seguros'],['pagamento','💰 Pagamento'],['veiculo','🚗 Veículo'],['dependentes','👨‍👩‍👧 Dependentes'],['historico','📋 Histórico']];
function render(){nav.innerHTML=pages.map(p=>`<button data-i="${p[1]}" class="${page===p[0]?'on':''}" onclick="page='${p[0]}';render()">${p[1]} &nbsp; ${p[2]}</button>`).join('');crumb.textContent=pages.find(p=>p[0]===page)[2];({dashboard:dash,employees:employees,yukyu:yukyu,dorms:dorms,masters:masters}[page])()}
function dash(){view.innerHTML=`<div class="titlebar"><div><h1>Dashboard</h1><p>Homologação funcional com dados gravados neste navegador.</p></div></div><div class="cards"><div class="card"><span class="muted">Funcionários</span><b>${db.employees.length}</b></div><div class="card"><span class="muted">Fábricas</span><b>${db.factories.length}</b></div><div class="card"><span class="muted">社宅</span><b>${db.dorms.length}</b></div><div class="card"><span class="muted">Bancos</span><b>${db.banks.length}</b></div></div><div class="panel"><b>V1 de homologação</b><p class="muted">Você pode cadastrar e alterar dados para validar os fluxos. A persistência ainda é localStorage.</p></div>`}
function openDrawer(title,tabs=[]){drawerTitle.textContent=title;drawerTabs.innerHTML=tabs.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('');drawerBody.innerHTML='';drawerFoot.innerHTML='';backdrop.classList.add('show');drawer.classList.add('show')}function closeDrawer(){backdrop.classList.remove('show');drawer.classList.remove('show')}
function employees(){view.innerHTML=`<div class="titlebar"><div><h1>Funcionários</h1><p>Abra um funcionário para editar qualquer aba.</p></div><button class="btn primary" onclick="newEmployee()">+ Novo funcionário</button></div><div class="tablewrap"><table class="table"><thead><tr><th>名前 / フリガナ</th><th>社員番号</th><th>JTEKT社員番号</th><th>Fábrica</th><th>Status</th></tr></thead><tbody>${db.employees.map(e=>`<tr class="click" onclick="openEmployee('${e.id}')"><td><b>${e.name}</b><div class="muted">${e.kana||''}</div></td><td>${e.empNo}</td><td>${e.jtektNo||''}</td><td>${by(db.factories,e.factoryId)?.name||''}</td><td><span class="badge ${e.status==='active'?'green':'amber'}">${e.status==='active'?'Ativo':'Pré-cadastro'}</span></td></tr>`).join('')}</tbody></table></div>`}
function newEmployee(){openDrawer('Novo funcionário');drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>名前 *</label><input id="n_name"></div><div class="field"><label>フリガナ</label><input id="n_kana"></div><div class="field"><label>社員番号 *</label><input id="n_no"></div><div class="field"><label>JTEKT社員番号</label><input id="n_j"></div></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createEmployee()">Criar</button>`}function createEmployee(){let no=v('n_no').trim(),name=v('n_name').trim();if(!name||!no)return alert('名前 e 社員番号 são obrigatórios.');if(db.employees.some(e=>e.empNo===no))return alert('社員番号 já utilizado.');let e={id:uid('e'),name,kana:v('n_kana'),empNo:no,jtektNo:v('n_j'),status:'draft',social:{},employment:{},vehicle:{active:true},dependents:[],documents:[],history:[{date:new Date().toISOString().slice(0,10),text:'Pré-cadastro criado'}]};db.employees.push(e);save();closeDrawer();render();openEmployee(e.id)}
function openEmployee(id,tab='dados'){let e=by(db.employees,id);openDrawer(`${e.name} — ${e.empNo}`,empTabs);drawerTabs.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>openEmployee(id,b.dataset.tab)});drawerBody.innerHTML=employeeForm(e,tab);drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveEmployeeTab('${id}','${tab}')">Salvar alterações</button>`}
function employeeForm(e,t){let opts=(arr,id,label='name')=>`<option value="">—</option>`+arr.map(x=>`<option value="${x.id}" ${id===x.id?'selected':''}>${x[label]||x.name}</option>`).join('');if(t==='dados')return `<div class="grid2"><div class="field"><label>名前</label><input id="e_name" value="${e.name||''}"></div><div class="field"><label>フリガナ</label><input id="e_kana" value="${e.kana||''}"></div><div class="field"><label>名前（ローマ字）</label><input id="e_romaji" value="${e.romaji||''}"></div><div class="field"><label>電話番号</label><input id="e_phone" value="${e.phone||''}"></div><div class="field"><label>メール</label><input id="e_email" value="${e.email||''}"></div><div class="field"><label>住所</label><input id="e_address" value="${e.address||''}"></div></div>`;if(t==='trabalho')return `<div class="grid2"><div class="field"><label>社員番号</label><input id="e_empNo" value="${e.empNo||''}"></div><div class="field"><label>JTEKT社員番号</label><input id="e_jtekt" value="${e.jtektNo||''}"></div><div class="field"><label>Fábrica</label><select id="e_factory" onchange="refreshEmployeeWork('${e.id}')">${opts(db.factories,e.factoryId)}</select></div><div class="field"><label>Setor</label><select id="e_sector">${opts(db.sectors.filter(s=>s.factoryId===e.factoryId),e.sectorId)}</select></div><div class="field"><label>班</label><select id="e_shift">${opts(db.shifts.filter(s=>s.factoryId===e.factoryId),e.shiftId)}</select></div><div class="field"><label>勤務</label><select id="e_work"><option ${e.work==='昼勤'?'selected':''}>昼勤</option><option ${e.work==='夜勤'?'selected':''}>夜勤</option><option ${e.work==='常昼'?'selected':''}>常昼</option><option ${e.work==='常夜'?'selected':''}>常夜</option></select></div><div class="field"><label>Status</label><select id="e_status"><option value="draft" ${e.status==='draft'?'selected':''}>Pré-cadastro</option><option value="active" ${e.status==='active'?'selected':''}>Ativo</option></select></div></div><div class="notice">勤務形態 foi removido: usamos 班 + 勤務. 常昼/常夜 não precisam de 班.</div>`;if(t==='moradia')return `<div class="grid2"><div class="field"><label>Moradia</label><select id="e_dorm">${opts(db.dorms,e.dormId)}</select></div><div class="field"><label>Endereço particular</label><input id="e_address2" value="${e.address||''}"></div></div>`;if(t==='documentos')return `<div class="grid2"><div><h3>Documentos</h3>${(e.documents||[]).map((d,i)=>`<div class="panel"><b>${d.type}</b><div class="field"><label>Validade</label><input type="date" id="doc_${i}" value="${d.validUntil||''}"></div><button class="btn danger mini" onclick="removeDoc('${e.id}',${i})">Remover</button></div>`).join('')||'<p class="muted">Nenhum documento.</p>'}</div><div><h3>Adicionar documento</h3><div class="field"><label>Tipo</label><select id="new_doc_type">${db.docTypes.map(d=>`<option>${d.ja||d.pt}</option>`).join('')}</select></div><div class="field"><label>Validade</label><input id="new_doc_valid" type="date"></div><button class="btn" onclick="addDoc('${e.id}')">Adicionar</button></div></div>`;if(t==='seguros')return `<div class="grid2"><div class="panel"><h3>社会保険</h3>${insuranceFields('soc',e.social||{})}</div><div class="panel"><h3>雇用保険</h3><div class="field"><label>Status</label><select id="emp_status">${statusOpts(e.employment?.status)}</select></div><div class="field"><label>雇用保険被保険者番号</label><input id="emp_number" value="${e.employment?.number||''}"></div><div class="field"><label>加入日</label><input id="emp_join" type="date" value="${e.employment?.join||''}"></div><div class="field"><label>喪失日</label><input id="emp_loss" type="date" value="${e.employment?.loss||''}"></div></div></div>`;if(t==='pagamento')return `<div class="grid2"><div class="field"><label>Banco</label><select id="e_bank">${opts(db.banks,e.bankId)}</select></div><div class="field"><label>Agência</label><select id="e_branch">${opts(db.branches.filter(b=>!e.bankId||b.bankId===e.bankId),e.branchId)}</select></div><div class="field"><label>口座番号</label><input id="e_account" value="${e.account||''}"></div></div>`;if(t==='veiculo')return `<div class="grid2"><div class="field"><label>Fabricante</label><input id="v_maker" value="${e.vehicle?.maker||''}"></div><div class="field"><label>Modelo</label><input id="v_model" value="${e.vehicle?.model||''}"></div><div class="field"><label>Placa</label><input id="v_plate" value="${e.vehicle?.plate||''}"></div><div class="field"><label>車検</label><input id="v_shaken" type="date" value="${e.vehicle?.shaken||''}"></div><div class="field"><label>任意保険</label><input id="v_hoken" type="date" value="${e.vehicle?.hoken||''}"></div><div class="field"><label>Status</label><select id="v_active"><option value="1" ${e.vehicle?.active!==false?'selected':''}>Em uso</option><option value="0" ${e.vehicle?.active===false?'selected':''}>Venda / encerrado</option></select></div></div>${e.vehicle?.active===false?'<div class="notice">Veículo encerrado: 車検 e 任意保険 não geram pendências.</div>':''}`;if(t==='dependentes')return `<div class="grid2"><div><h3>Dependentes</h3>${(e.dependents||[]).map((d,i)=>`<div class="panel"><b>${d.name}</b><p>${d.relation||''} · ${d.birth||''}</p><button class="btn danger mini" onclick="removeDep('${e.id}',${i})">Remover</button></div>`).join('')||'<p class="muted">Nenhum dependente.</p>'}</div><div><h3>Adicionar</h3><div class="field"><label>Nome</label><input id="dep_name"></div><div class="field"><label>Parentesco</label><input id="dep_rel"></div><div class="field"><label>Nascimento</label><input id="dep_birth" type="date"></div><label><input id="dep_social" type="checkbox"> 社保扶養</label><div><button class="btn" onclick="addDep('${e.id}')">Adicionar</button></div></div></div>`;return `<div class="panel"><h3>Histórico</h3>${(e.history||[]).map(h=>`<p><b>${h.date}</b> — ${h.text}</p>`).join('')||'<p class="muted">Sem histórico.</p>'}</div>`}
function insuranceFields(p,s){return `<div class="field"><label>Status</label><select id="${p}_status">${statusOpts(s.status)}</select></div><div class="field"><label>社会保険加入日</label><input id="${p}_join" type="date" value="${s.join||''}"></div><div class="field"><label>健康保険記号</label><input id="${p}_symbol" value="${s.symbol||''}"></div><div class="field"><label>健康保険番号</label><input id="${p}_number" value="${s.number||''}"></div><div class="field"><label>基礎年金番号</label><input id="${p}_pension" value="${s.pension||''}"></div>`}function statusOpts(cur){return ['未加入','加入手続中','加入中','喪失手続中','喪失済'].map(x=>`<option ${cur===x?'selected':''}>${x}</option>`).join('')}
function saveEmployeeTab(id,t){let e=by(db.employees,id);if(t==='dados')Object.assign(e,{name:v('e_name'),kana:v('e_kana'),romaji:v('e_romaji'),phone:v('e_phone'),email:v('e_email'),address:v('e_address')});if(t==='trabalho'){let no=v('e_empNo');if(db.employees.some(x=>x.id!==id&&x.empNo===no))return alert('社員番号 já utilizado.');Object.assign(e,{empNo:no,jtektNo:v('e_jtekt'),factoryId:v('e_factory'),sectorId:v('e_sector'),shiftId:v('e_shift'),work:v('e_work'),status:v('e_status')})}if(t==='moradia')Object.assign(e,{dormId:v('e_dorm'),address:v('e_address2')});if(t==='documentos')(e.documents||[]).forEach((d,i)=>d.validUntil=v('doc_'+i));if(t==='seguros'){e.social={status:v('soc_status'),join:v('soc_join'),symbol:v('soc_symbol'),number:v('soc_number'),pension:v('soc_pension')};e.employment={status:v('emp_status'),number:v('emp_number'),join:v('emp_join'),loss:v('emp_loss')}}if(t==='pagamento')Object.assign(e,{bankId:v('e_bank'),branchId:v('e_branch'),account:v('e_account')});if(t==='veiculo')e.vehicle={maker:v('v_maker'),model:v('v_model'),plate:v('v_plate'),shaken:v('v_shaken'),hoken:v('v_hoken'),active:v('v_active')==='1'};e.history=e.history||[];e.history.unshift({date:new Date().toISOString().slice(0,10),text:`Aba ${t} alterada`});save();openEmployee(id,t);render()}
function addDoc(id){let e=by(db.employees,id);e.documents=e.documents||[];e.documents.push({id:uid('doc'),type:v('new_doc_type'),validUntil:v('new_doc_valid')});save();openEmployee(id,'documentos')}function removeDoc(id,i){by(db.employees,id).documents.splice(i,1);save();openEmployee(id,'documentos')}function addDep(id){let e=by(db.employees,id);e.dependents=e.dependents||[];e.dependents.push({id:uid('dep'),name:v('dep_name'),relation:v('dep_rel'),birth:v('dep_birth'),social:c('dep_social')});save();openEmployee(id,'dependentes')}function removeDep(id,i){by(db.employees,id).dependents.splice(i,1);save();openEmployee(id,'dependentes')}
function refreshEmployeeWork(id){let e=by(db.employees,id);e.factoryId=v('e_factory');openEmployee(id,'trabalho')}
function yukyu(){view.innerHTML=`<div class="titlebar"><div><h1>有休管理</h1><p>Controle administrativo por funcionário.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Funcionário</th><th>Saldo</th><th>Próxima previsão</th></tr></thead><tbody>${db.employees.map(e=>{let y=db.yukyu.find(x=>x.employeeId===e.id),saldo=(y?.lots||[]).reduce((a,l)=>a+l.granted-l.used,0);return `<tr class="click" onclick="openYukyu('${e.id}')"><td>${e.name}</td><td>${saldo}</td><td>${y?.forecast?.[0]?.date||'—'}</td></tr>`}).join('')}</tbody></table></div>`}function openYukyu(id){let e=by(db.employees,id),y=db.yukyu.find(x=>x.employeeId===id)||{employeeId:id,lots:[],forecast:[]};if(!db.yukyu.includes(y))db.yukyu.push(y);openDrawer(`有休 — ${e.name}`);drawerBody.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Aquisição</th><th>Validade</th><th>Recebido</th><th>Usado</th><th>Saldo</th></tr></thead><tbody>${y.lots.map(l=>`<tr><td>${l.acq}</td><td>${l.expire}</td><td>${l.granted}</td><td>${l.used}</td><td>${l.granted-l.used}</td></tr>`).join('')}</tbody></table></div><h3>Registrar utilização</h3><div class="grid2"><div class="field"><label>Data</label><input id="yu_date" type="date"></div><div class="field"><label>Dias</label><input id="yu_days" type="number" step="0.5" value="1"></div></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="useYukyu('${id}')">Registrar</button>`}function useYukyu(id){let y=db.yukyu.find(x=>x.employeeId===id),n=Number(v('yu_days'));if(!n||n<=0)return;let lots=[...y.lots].sort((a,b)=>b.acq.localeCompare(a.acq));for(let l of lots){let free=l.granted-l.used,t=Math.min(free,n);l.used+=t;n-=t;if(n<=0)break}save();openYukyu(id);render()}
function dorms(){view.innerHTML=`<div class="titlebar"><div><h1>社宅管理</h1><p>Lista de imóveis cadastrados.</p></div><button class="btn primary" onclick="newDorm()">+ Novo 社宅</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Imóvel</th><th>Endereço</th><th>Capacidade</th><th>Custo base</th></tr></thead><tbody>${db.dorms.map(d=>`<tr class="click" onclick="openDorm('${d.id}')"><td><b>${d.name}</b></td><td>${d.address}</td><td>${d.capacity}</td><td>${fmt(d.rent+d.fee)}</td></tr>`).join('')}</tbody></table></div>`}function newDorm(){openDrawer('Novo 社宅');drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>Nome</label><input id="d_name"></div><div class="field"><label>Endereço</label><input id="d_address"></div><div class="field"><label>Capacidade</label><input id="d_cap" type="number" value="1"></div><div class="field"><label>Aluguel empresa</label><input id="d_rent" type="number"></div><div class="field"><label>Encargo</label><input id="d_fee" type="number"></div></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createDorm()">Criar</button>`}function createDorm(){db.dorms.push({id:uid('h'),name:v('d_name'),address:v('d_address'),capacity:Number(v('d_cap')||1),rent:Number(v('d_rent')),fee:Number(v('d_fee')),mode:'shared',perPerson:0,appliances:[],utilities:{electric:{},gas:{},water:{}}});save();closeDrawer();render()}
function openDorm(id,tab='dados'){let d=by(db.dorms,id),tabs=[['dados','🏠 Dados'],['equip','🧊 Equipamentos'],['serv','⚡ Serviços']];openDrawer(d.name,tabs);drawerTabs.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>openDorm(id,b.dataset.tab)});if(tab==='dados')drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>Nome</label><input id="od_name" value="${d.name}"></div><div class="field"><label>Endereço</label><input id="od_address" value="${d.address}"></div><div class="field"><label>Capacidade</label><input id="od_cap" type="number" value="${d.capacity}"></div><div class="field"><label>Modo</label><select id="od_mode"><option value="shared" ${d.mode==='shared'?'selected':''}>Compartilhado</option><option value="single" ${d.mode==='single'?'selected':''}>Individual</option></select></div><div class="field"><label>Aluguel empresa</label><input id="od_rent" type="number" value="${d.rent}"></div><div class="field"><label>Encargo</label><input id="od_fee" type="number" value="${d.fee}"></div><div class="field"><label>Valor por pessoa</label><input id="od_pp" type="number" value="${d.perPerson||0}"></div></div>`;if(tab==='equip')drawerBody.innerHTML=`${d.appliances.map((a,i)=>`<div class="panel"><b>${a.type}</b> — ${a.control}<button class="btn danger mini" style="float:right" onclick="removeAppliance('${id}',${i})">Remover</button></div>`).join('')}<h3>Adicionar</h3><div class="grid2"><div class="field"><label>Tipo</label><input id="ap_type"></div><div class="field"><label>Nº controle</label><input id="ap_control"></div></div><button class="btn" onclick="addAppliance('${id}')">Adicionar</button>`;if(tab==='serv')drawerBody.innerHTML=['electric','gas','water'].map(k=>{let u=d.utilities[k]||{};return `<div class="panel"><h3>${k==='electric'?'⚡ 電気':k==='gas'?'🔥 ガス':'💧 水道'}</h3><label><input id="${k}_on" type="checkbox" ${u.on?'checked':''}> Ligado</label><div class="grid2"><div class="field"><label>Ligação</label><input id="${k}_onDate" type="date" value="${u.onDate||''}"></div><div class="field"><label>Desligamento</label><input id="${k}_offDate" type="date" value="${u.offDate||''}"></div><div class="field"><label>Observações / 立ち合い / 預り金</label><textarea id="${k}_note">${u.note||''}</textarea></div><div class="field"><label>Endereço da última conta</label><input id="${k}_last" value="${u.lastBillAddress||''}"></div></div></div>`}).join('');drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveDorm('${id}','${tab}')">Salvar</button>`}function saveDorm(id,t){let d=by(db.dorms,id);if(t==='dados')Object.assign(d,{name:v('od_name'),address:v('od_address'),capacity:Number(v('od_cap')),mode:v('od_mode'),rent:Number(v('od_rent')),fee:Number(v('od_fee')),perPerson:Number(v('od_pp'))});if(t==='serv')['electric','gas','water'].forEach(k=>d.utilities[k]={on:c(k+'_on'),onDate:v(k+'_onDate'),offDate:v(k+'_offDate'),note:v(k+'_note'),lastBillAddress:v(k+'_last')});save();openDorm(id,t);render()}function addAppliance(id){by(db.dorms,id).appliances.push({type:v('ap_type'),control:v('ap_control')});save();openDorm(id,'equip')}function removeAppliance(id,i){by(db.dorms,id).appliances.splice(i,1);save();openDorm(id,'equip')}
function masters(){let groups=[['Clientes',db.clients,'client'],['Fábricas',db.factories,'factory'],['Setores',db.sectors,'sector'],['班',db.shifts,'shift'],['Bancos',db.banks,'bank'],['Agências',db.branches,'branch'],['Tipos de documento',db.docTypes,'docType']];view.innerHTML=`<div class="titlebar"><div><h1>Cadastros Mestres</h1><p>Cadastre os dados reutilizados pelo sistema.</p></div></div><div class="grid2">${groups.map(g=>`<div class="panel"><h3>${g[0]}</h3><p class="muted">${g[1].length} cadastrados</p><button class="btn primary" onclick="masterList('${g[2]}')">Gerenciar</button></div>`).join('')}</div>`}function masterConfig(type){return {client:['Clientes','clients'],factory:['Fábricas','factories'],sector:['Setores','sectors'],shift:['班','shifts'],bank:['Bancos','banks'],branch:['Agências','branches'],docType:['Tipos de documento','docTypes']}[type]}function masterList(type){let [title,key]=masterConfig(type),arr=db[key];openDrawer(title);drawerBody.innerHTML=`<div class="tablewrap"><table class="table"><tbody>${arr.map(x=>`<tr><td>${x.name||x.ja||x.pt}</td><td><button class="btn mini" onclick="editMaster('${type}','${x.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="editMaster('${type}','')">+ Novo</button>`}function editMaster(type,id){let [title,key]=masterConfig(type),x=by(db[key],id)||{};openDrawer((id?'Editar ':'Novo ')+title);let extra='';if(type==='factory')extra=`<div class="field"><label>Cliente</label><select id="m_parent">${db.clients.map(c=>`<option value="${c.id}" ${x.clientId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Código curto</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='sector'||type==='shift')extra=`<div class="field"><label>Fábrica</label><select id="m_parent">${db.factories.map(f=>`<option value="${f.id}" ${x.factoryId===f.id?'selected':''}>${f.name}</option>`).join('')}</select></div>`;if(type==='branch')extra=`<div class="field"><label>Banco</label><select id="m_parent">${db.banks.map(b=>`<option value="${b.id}" ${x.bankId===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label>店番</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='bank')extra=`<div class="field"><label>Código</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='docType')drawerBody.innerHTML=`<div class="field"><label>日本語</label><input id="m_name" value="${x.ja||''}"></div><div class="field"><label>Português</label><input id="m_pt" value="${x.pt||''}"></div>`;else drawerBody.innerHTML=`<div class="field"><label>Nome</label><input id="m_name" value="${x.name||''}"></div>${extra}${type==='shift'?'<div class="grid2"><div class="field"><label>昼勤 início</label><input id="m_ds" type="time" value="'+(x.dayStart||'')+'"></div><div class="field"><label>昼勤 fim</label><input id="m_de" type="time" value="'+(x.dayEnd||'')+'"></div><div class="field"><label>夜勤 início</label><input id="m_ns" type="time" value="'+(x.nightStart||'')+'"></div><div class="field"><label>夜勤 fim</label><input id="m_ne" type="time" value="'+(x.nightEnd||'')+'"></div></div>':''}`;drawerFoot.innerHTML=`<button class="btn" onclick="masterList('${type}')">Voltar</button><button class="btn primary" onclick="saveMaster('${type}','${id}')">Salvar</button>`}function saveMaster(type,id){let [title,key]=masterConfig(type),x=by(db[key],id)||{id:uid(type)};if(type==='docType'){x.ja=v('m_name');x.pt=v('m_pt')}else x.name=v('m_name');if(type==='factory'){x.clientId=v('m_parent');x.code=v('m_code')}if(type==='sector'||type==='shift')x.factoryId=v('m_parent');if(type==='branch'){x.bankId=v('m_parent');x.code=v('m_code')}if(type==='bank')x.code=v('m_code');if(type==='shift'){x.dayStart=v('m_ds');x.dayEnd=v('m_de');x.nightStart=v('m_ns');x.nightEnd=v('m_ne')}if(!id)db[key].push(x);save();masterList(type);render()}
render();
</script></body></html>
