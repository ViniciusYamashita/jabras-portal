<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabras Neo — Homologação V1</title><style>
:root{--navy:#0b2340;--blue:#2167d7;--bg:#f4f7fb;--line:#dfe6ef;--text:#1a2433;--muted:#718096;--green:#16855f;--amber:#b87817;--red:#c84343}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;padding:8px 10px 20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe6f3;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#1f5fb2;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.titlebar h1{margin:0;font-size:28px}.titlebar p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-top:1px solid var(--line);text-align:left}.table th{background:#f8fafc;color:var(--muted);font-size:12px}.table tr:first-child th{border-top:0}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.green{background:#e8f6ef;color:var(--green)}.amber{background:#fff2dc;color:var(--amber)}.red{background:#fdeaea;color:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:80px}.section{margin-bottom:16px}.section h3{margin:0 0 12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:0;background:#edf2f7;color:#526173;border-radius:8px;padding:9px 12px;cursor:pointer}.tabs button.on{background:#dbe9ff;color:#1557b7;font-weight:700}.modalbg{position:fixed;inset:0;background:#00152d66;display:none;align-items:center;justify-content:center;z-index:20}.modalbg.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(760px,94vw);max-height:90vh;overflow:auto;padding:20px}.modal h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:30px}.link{color:var(--blue);cursor:pointer;font-weight:700}.split{display:grid;grid-template-columns:1fr 320px;gap:16px}.sidebox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.warn{padding:10px;border-radius:10px;background:#fff7e8;color:#875816;margin-bottom:8px}.dangerbox{padding:10px;border-radius:10px;background:#fff0f0;color:#a22f2f;margin-bottom:8px}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand{font-size:0}.brand:before{content:'JN';font-size:18px}.nav button{font-size:0}.nav button:before{content:attr(data-i);font-size:18px}.cards{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.grid3,.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">JABRAS NEO<small>Homologação V1</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><div><b id="crumb">Dashboard</b></div><div><select id="lang" class="btn"><option value="pt">Português</option><option value="ja">日本語</option></select> <span class="badge green">HOMOLOGAÇÃO</span></div></header><div class="content" id="view"></div></main></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>
const K='jabras_homolog_v1';
const seed={clients:[{id:'c1',name:'JTEKT',active:true}],factories:[{id:'f1',clientId:'c1',name:'岡崎',code:'岡',active:true},{id:'f2',clientId:'c1',name:'花園',code:'花',active:true}],sectors:[{id:'s1',factoryId:'f1',name:'物流課',active:true}],shifts:[{id:'b1',factoryId:'f1',name:'A班',dayStart:'06:25',dayEnd:'15:05',nightStart:'16:10',nightEnd:'00:50',active:true}],banks:[{id:'bk1',name:'三菱UFJ銀行',code:'0005',active:true}],branches:[{id:'br1',bankId:'bk1',name:'岡崎支店',code:'718',active:true}],nationalities:[{id:'n1',pt:'Brasil',ja:'ブラジル',lang:'Português',active:true},{id:'n2',pt:'Japão',ja:'日本',lang:'日本語',active:true}],docTypes:[{id:'d1',pt:'Cartão de Residência',ja:'在留カード',validity:true,active:true}],occTypes:[{id:'o1',pt:'Advertência escrita',ja:'書面注意',active:true}],terminationReasons:[{id:'t1',pt:'Pedido de demissão',ja:'自己都合退職',active:true}],dorms:[{id:'h1',name:'ハイツ一番地101',postal:'444-0015',address:'岡崎市中町1丁目1-7',capacity:2,mode:'single',rent:44550,fee:5000,perPerson:0,keys:3,parking:1,utilities:{electric:{on:true,onDate:'2026-04-01',offDate:'',note:''},gas:{on:true,onDate:'2026-04-01',offDate:'',note:'立ち合い必要'},water:{on:true,onDate:'2026-04-01',offDate:'',note:''}},appliances:[{type:'冷蔵庫',control:'G005'},{type:'洗濯機',control:'M005'},{type:'コンロ',control:'FP005'},{type:'照明',control:'L015'}]}],employees:[{id:'e1',name:'カルロス・シルバ',kana:'カルロス・シルバ',empNo:'1024',jtektNo:'45128',factoryId:'f1',sectorId:'s1',shiftId:'b1',work:'夜勤',status:'active',nationalityId:'n1',phone:'090-1234-5678',email:'carlos@example.com',social:{status:'加入中',join:'2026-04-01',symbol:'123',number:'456789',pension:'1234-567890'},employment:{status:'加入中',number:'1234-567890-1',join:'2026-04-01',loss:''},dormId:'h1',vehicle:{maker:'Toyota',model:'Prius',plate:'岡崎 300 あ 12-34',active:true,shaken:'2027-01-20',hoken:'2027-03-31'}}],yukyu:[{employeeId:'e1',lots:[{acq:'2025-09-24',expire:'2027-09-23',granted:10,used:5},{acq:'2026-09-24',expire:'2028-09-23',granted:11,used:0}],forecast:[{date:'2026-09-10',status:'open'}]}],profiles:[{id:'p1',name:'Administrador',protected:true,perms:{employees:'edit',yukyu:'edit',dorms:'edit',masters:'edit',settings:'edit'}}],users:[{id:'u1',name:'Administrador',profileId:'p1',allFactories:true,factoryIds:[]}],settings:{employeeNumberMode:'manual',defaultLang:'ja',dateFormat:'YYYY/MM/DD'}};
let db=load();function load(){try{return JSON.parse(localStorage.getItem(K))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(K,JSON.stringify(db))}function id(p){return p+Math.random().toString(36).slice(2,9)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function val(id){return document.getElementById(id)?.value??''}function chk(id){return !!document.getElementById(id)?.checked}function fmt(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}function by(a,k,v){return a.find(x=>x[k]===v)}
const pages=[['dashboard','▦','Dashboard'],['employees','👥','Funcionários'],['yukyu','休','有休管理'],['dorms','⌂','社宅管理'],['masters','⚙','Cadastros Mestres'],['settings','☷','Configurações']];let page='dashboard';let selectedEmployee=null;
function nav(){navEl=document.getElementById('nav');navEl.innerHTML=pages.map(x=>`<button data-i="${x[1]}" class="${page===x[0]?'on':''}" onclick="page='${x[0]}';selectedEmployee=null;render()">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function render(){nav();document.getElementById('crumb').textContent=pages.find(x=>x[0]===page)?.[2]||'';({dashboard:dash,employees:employees,yukyu:yukyu,dorms:dorms,masters:masters,settings:settings}[page]||dash)()}
function dash(){let active=db.employees.filter(e=>e.status==='active').length;view.innerHTML=`<div class="titlebar"><div><h1>Dashboard</h1><p>Ambiente funcional de homologação.</p></div></div><div class="cards"><div class="card"><span class="muted">Funcionários ativos</span><b>${active}</b></div><div class="card"><span class="muted">社宅</span><b>${db.dorms.length}</b></div><div class="card"><span class="muted">Fábricas</span><b>${db.factories.length}</b></div><div class="card"><span class="muted">Cadastros mestres</span><b>${db.clients.length+db.banks.length+db.docTypes.length}</b></div></div><div class="panel"><h3>Teste de homologação</h3><p>Os dados criados nesta página ficam salvos no navegador usando localStorage. Você pode cadastrar clientes, fábricas, setores, 班, bancos, agências, nacionalidades, documentos, funcionários, 社宅 e testar vínculos entre eles.</p><p><b>Importante:</b> esta V1 é funcional para homologação, mas ainda não usa banco de dados central. Dados criados em outro computador/navegador não serão compartilhados nesta etapa.</p></div>`}
function employees(){if(selectedEmployee){employeeDetail(selectedEmployee);return}let rows=db.employees.map(e=>{let f=by(db.factories,'id',e.factoryId);return `<tr><td><span class="link" onclick="selectedEmployee='${e.id}';render()">${esc(e.name)}</span><div class="muted">${esc(e.kana)}</div></td><td>${esc(e.empNo)}</td><td>${esc(e.jtektNo)}</td><td>${esc(f?.name||'')}</td><td>${e.status==='active'?'<span class="badge green">Ativo</span>':'<span class="badge amber">Pré-cadastro</span>'}</td></tr>`}).join('');view.innerHTML=`<div class="titlebar"><div><h1>Funcionários</h1><p>Cadastro real de homologação com dados persistentes no navegador.</p></div><button class="btn primary" onclick="employeeModal()">+ Novo funcionário</button></div><div class="tablewrap"><table class="table"><tr><th>名前 / フリガナ</th><th>社員番号</th><th>JTEKT社員番号</th><th>Fábrica</th><th>Status</th></tr>${rows||'<tr><td colspan=5 class=empty>Nenhum funcionário</td></tr>'}</table></div>`}
function employeeModal(eid){let e=by(db.employees,'id',eid)||{};let fs=db.factories.map(x=>`<option value="${x.id}" ${e.factoryId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');openModal(`<h2>${eid?'Editar':'Novo'} funcionário</h2><div class="grid2"><div class="field"><label>名前 *</label><input id="m_name" value="${esc(e.name||'')}"></div><div class="field"><label>フリガナ</label><input id="m_kana" value="${esc(e.kana||'')}"></div><div class="field"><label>社員番号 *</label><input id="m_emp" value="${esc(e.empNo||'')}"></div><div class="field"><label>JTEKT社員番号</label><input id="m_jtekt" value="${esc(e.jtektNo||'')}"></div><div class="field"><label>Fábrica</label><select id="m_factory"><option value="">—</option>${fs}</select></div><div class="field"><label>Status</label><select id="m_status"><option value="draft" ${e.status==='draft'?'selected':''}>Pré-cadastro</option><option value="active" ${e.status==='active'?'selected':''}>Ativo</option></select></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveEmployee('${eid||''}')">Salvar</button></div>`)}
function saveEmployee(eid){let empNo=val('m_emp').trim(),name=val('m_name').trim();if(!name||!empNo){alert('名前 e 社員番号 são obrigatórios.');return}let dup=db.employees.find(x=>x.empNo===empNo&&x.id!==eid);if(dup){let nums=db.employees.map(x=>+x.empNo).filter(Number.isFinite);alert('社員番号 já utilizado. Próximo disponível sugerido: '+(Math.max(0,...nums)+1));return}let e=by(db.employees,'id',eid);if(!e){e={id:id('e'),social:{},employment:{},vehicle:{active:false}};db.employees.push(e)}Object.assign(e,{name,kana:val('m_kana'),empNo,jtektNo:val('m_jtekt'),factoryId:val('m_factory'),status:val('m_status')});save();closeModal();render()}
function employeeDetail(eid){let e=by(db.employees,'id',eid),f=by(db.factories,'id',e.factoryId);view.innerHTML=`<div class="titlebar"><div><button class="btn" onclick="selectedEmployee=null;render()">← Voltar</button><h1 style="margin-top:10px">${esc(e.name)}</h1><p>社員番号 ${esc(e.empNo)} · JTEKT社員番号 ${esc(e.jtektNo||'—')} · ${esc(f?.name||'')}</p></div><button class="btn" onclick="employeeModal('${e.id}')">Editar básico</button></div><div class="tabs" id="etabs"><button class="on" onclick="empTab('${e.id}','work',this)">▣ Trabalho</button><button onclick="empTab('${e.id}','insurance',this)">◇ Seguros</button><button onclick="empTab('${e.id}','vehicle',this)">▱ Veículo</button></div><div id="empbody"></div>`;empTab(e.id,'work',document.querySelector('#etabs button'))}
function empTab(eid,t,b){document.querySelectorAll('#etabs button').forEach(x=>x.classList.remove('on'));b?.classList.add('on');let e=by(db.employees,'id',eid);if(t==='work'){let facts=db.factories.map(x=>`<option value="${x.id}" ${e.factoryId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');let secs=db.sectors.filter(x=>x.factoryId===e.factoryId).map(x=>`<option value="${x.id}" ${e.sectorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');let shifts=db.shifts.filter(x=>x.factoryId===e.factoryId).map(x=>`<option value="${x.id}" ${e.shiftId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');empbody.innerHTML=`<div class="panel"><h3>Alocação atual</h3><div class="grid2"><div class="field"><label>Fábrica</label><select id="ew_factory">${facts}</select></div><div class="field"><label>Setor</label><select id="ew_sector"><option value="">—</option>${secs}</select><button class="btn" style="margin-top:6px" onclick="quickSector('${e.id}')">+ Cadastrar setor</button></div><div class="field"><label>班</label><select id="ew_shift"><option value="">— / 常昼 / 常夜</option>${shifts}</select><button class="btn" style="margin-top:6px" onclick="quickShift('${e.id}')">+ Cadastrar 班</button></div><div class="field"><label>勤務</label><select id="ew_work"><option value="昼勤" ${e.work==='昼勤'?'selected':''}>昼勤</option><option value="夜勤" ${e.work==='夜勤'?'selected':''}>夜勤</option><option value="常昼" ${e.work==='常昼'?'selected':''}>常昼</option><option value="常夜" ${e.work==='常夜'?'selected':''}>常夜</option></select></div><div class="field"><label>JTEKT社員番号</label><input id="ew_j" value="${esc(e.jtektNo||'')}"></div><div class="field"><label>Responsável no cliente</label><input id="ew_resp" value="${esc(e.clientResponsible||'')}"></div></div><div class="actions"><button class="btn primary" onclick="saveWork('${e.id}')">Salvar alterações</button></div></div>`}else if(t==='insurance'){let s=e.social||{},m=e.employment||{};empbody.innerHTML=`<div class="grid2"><div class="panel"><h3>社会保険</h3>${insuranceFields('soc',s)}</div><div class="panel"><h3>雇用保険</h3><div class="grid2"><div class="field"><label>Status</label><select id="emp_status">${statusOpts(m.status)}</select></div><div class="field"><label>雇用保険被保険者番号</label><input id="emp_num" value="${esc(m.number||'')}"></div><div class="field"><label>加入日</label><input id="emp_join" type="date" value="${m.join||''}"></div><div class="field"><label>喪失日</label><input id="emp_loss" type="date" value="${m.loss||''}"></div></div></div></div><div class="actions"><button class="btn primary" onclick="saveInsurance('${e.id}')">Salvar seguros</button></div>`}else{let v=e.vehicle||{};empbody.innerHTML=`<div class="panel"><h3>Veículo atual</h3><div class="grid3"><div class="field"><label>Fabricante</label><input id="v_maker" value="${esc(v.maker||'')}"></div><div class="field"><label>Modelo</label><input id="v_model" value="${esc(v.model||'')}"></div><div class="field"><label>Placa</label><input id="v_plate" value="${esc(v.plate||'')}"></div><div class="field"><label>車検 validade</label><input id="v_shaken" type="date" value="${v.shaken||''}"></div><div class="field"><label>任意保険 validade</label><input id="v_hoken" type="date" value="${v.hoken||''}"></div><div class="field"><label>Status</label><select id="v_active"><option value="1" ${v.active!==false?'selected':''}>Em uso</option><option value="0" ${v.active===false?'selected':''}>Venda/baixa</option></select></div></div>${v.active===false?'<p class="muted">Veículo encerrado: 車検 e 任意保険 não geram pendências.</p>':''}<div class="actions"><button class="btn primary" onclick="saveVehicle('${e.id}')">Salvar veículo</button></div></div>`}}
function insuranceFields(p,s){return `<div class="grid2"><div class="field"><label>Status</label><select id="${p}_status">${statusOpts(s.status)}</select></div><div class="field"><label>社会保険加入日</label><input id="${p}_join" type="date" value="${s.join||''}"></div><div class="field"><label>健康保険記号</label><input id="${p}_symbol" value="${esc(s.symbol||'')}"></div><div class="field"><label>健康保険番号</label><input id="${p}_number" value="${esc(s.number||'')}"></div><div class="field"><label>基礎年金番号</label><input id="${p}_pension" value="${esc(s.pension||'')}"></div></div>`}function statusOpts(v){return ['未加入','加入手続中','加入中','喪失手続中','喪失済'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}
function saveWork(eid){let e=by(db.employees,'id',eid);e.factoryId=val('ew_factory');e.sectorId=val('ew_sector');e.shiftId=val('ew_shift');e.work=val('ew_work');e.jtektNo=val('ew_j');e.clientResponsible=val('ew_resp');save();render()}
function saveInsurance(eid){let e=by(db.employees,'id',eid);e.social={status:val('soc_status'),join:val('soc_join'),symbol:val('soc_symbol'),number:val('soc_number'),pension:val('soc_pension')};e.employment={status:val('emp_status'),number:val('emp_num'),join:val('emp_join'),loss:val('emp_loss')};save();render()}
function saveVehicle(eid){let e=by(db.employees,'id',eid);e.vehicle={maker:val('v_maker'),model:val('v_model'),plate:val('v_plate'),shaken:val('v_shaken'),hoken:val('v_hoken'),active:val('v_active')==='1'};save();render()}
function quickSector(eid){let e=by(db.employees,'id',eid);let n=prompt('Nome do novo setor');if(!n)return;if(db.sectors.some(x=>x.factoryId===e.factoryId&&x.name.trim()===n.trim())){alert('Setor já existe.');return}let s={id:id('s'),factoryId:e.factoryId,name:n,active:true};db.sectors.push(s);e.sectorId=s.id;save();render()}
function quickShift(eid){let e=by(db.employees,'id',eid);let n=prompt('Nome do 班 (ex.: B班, C班)');if(!n)return;let s={id:id('b'),factoryId:e.factoryId,name:n,dayStart:'',dayEnd:'',nightStart:'',nightEnd:'',active:true};db.shifts.push(s);e.shiftId=s.id;save();render()}
function yukyu(){let rows=db.employees.map(e=>{let y=db.yukyu.find(x=>x.employeeId===e.id)||{lots:[],forecast:[]};let total=y.lots.reduce((a,l)=>a+l.granted-l.used,0);let oldest=[...y.lots].filter(l=>l.granted>l.used).sort((a,b)=>a.expire.localeCompare(b.expire))[0];let open=y.forecast?.find(x=>x.status==='open');return `<tr><td><span class="link" onclick="yukyuDetail('${e.id}')">${esc(e.name)}</span></td><td>${total}</td><td>${open?.date||'—'}</td><td>${oldest?oldest.expire:'—'}</td><td>${oldest?oldest.granted-oldest.used:0}</td></tr>`}).join('');view.innerHTML=`<div class="titlebar"><div><h1>有休管理</h1><p>Visão administrativa de todos os funcionários.</p></div></div><div class="tablewrap"><table class="table"><tr><th>Funcionário</th><th>Saldo disponível</th><th>Previsão de folga</th><th>Próximo vencimento</th><th>Saldo do lote antigo</th></tr>${rows}</table></div>`}
function yukyuDetail(eid){let e=by(db.employees,'id',eid),y=db.yukyu.find(x=>x.employeeId===eid);if(!y){y={employeeId:eid,lots:[],forecast:[]};db.yukyu.push(y)}let lots=[...y.lots].sort((a,b)=>b.acq.localeCompare(a.acq));openModal(`<h2>有休 — ${esc(e.name)}</h2><p class="muted">Uso é descontado sempre do lote mais recente.</p><div class="tablewrap"><table class="table"><tr><th>Aquisição</th><th>Validade</th><th>Recebido</th><th>Usado</th><th>Saldo</th></tr>${lots.map(l=>`<tr><td>${l.acq}</td><td>${l.expire}</td><td>${l.granted}</td><td>${l.used}</td><td>${l.granted-l.used}</td></tr>`).join('')}</table></div><div class="grid2" style="margin-top:14px"><div class="field"><label>Data de utilização</label><input id="yu_date" type="date"></div><div class="field"><label>Dias</label><select id="yu_days"><option value="1">1 dia</option><option value="0.5">0,5 dia</option></select></div></div><div class="actions"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="useYukyu('${eid}')">Registrar utilização</button></div>`)}
function useYukyu(eid){let y=db.yukyu.find(x=>x.employeeId===eid),need=+val('yu_days');let lots=[...y.lots].sort((a,b)=>b.acq.localeCompare(a.acq));for(let l of lots){let avail=l.granted-l.used;if(avail<=0)continue;let take=Math.min(avail,need);l.used+=take;need-=take;if(need<=0)break}if(need>0){alert('Saldo insuficiente.');return}save();closeModal();render()}
function dorms(){let rows=db.dorms.map(h=>{let residents=db.employees.filter(e=>e.dormId===h.id&&e.status!=='off').length;let max=h.mode==='single'?1:h.capacity;return `<tr><td><span class="link" onclick="dormDetail('${h.id}')">${esc(h.name)}</span><div class="muted">${esc(h.address)}</div></td><td>${residents}/${max}</td><td>${fmt(h.rent)}</td><td>${fmt(h.fee)}</td><td>${h.utilities.electric.on?'●':'○'} / ${h.utilities.gas.on?'●':'○'} / ${h.utilities.water.on?'●':'○'}</td></tr>`}).join('');view.innerHTML=`<div class="titlebar"><div><h1>社宅管理</h1><p>Lista de imóveis, moradores, custos, equipamentos e serviços.</p></div><button class="btn primary" onclick="dormModal()">+ Novo 社宅</button></div><div class="tablewrap"><table class="table"><tr><th>Imóvel</th><th>Moradores</th><th>家賃</th><th>Encargo</th><th>電気 / ガス / 水道</th></tr>${rows}</table></div>`}
function dormModal(hid){let h=by(db.dorms,'id',hid)||{utilities:{electric:{},gas:{},water:{}},appliances:[]};openModal(`<h2>${hid?'Editar':'Novo'} 社宅</h2><div class="grid2"><div class="field"><label>Nome *</label><input id="h_name" value="${esc(h.name||'')}"></div><div class="field"><label>〒郵便番号</label><input id="h_postal" value="${esc(h.postal||'')}"></div><div class="field" style="grid-column:1/-1"><label>Endereço</label><input id="h_address" value="${esc(h.address||'')}"></div><div class="field"><label>Capacidade física</label><input id="h_cap" type="number" min="1" value="${h.capacity||1}"></div><div class="field"><label>Ocupação</label><select id="h_mode"><option value="shared" ${h.mode==='shared'?'selected':''}>Compartilhado</option><option value="single" ${h.mode==='single'?'selected':''}>Moradia individual</option></select></div><div class="field"><label>家賃 pago pela empresa</label><input id="h_rent" type="number" value="${h.rent||0}"></div><div class="field"><label>Encargo mensal</label><input id="h_fee" type="number" value="${h.fee||0}"></div><div class="field"><label>Valor mensal por pessoa (compartilhado)</label><input id="h_person" type="number" value="${h.perPerson||0}"></div><div class="field"><label>Quantidade de chaves</label><input id="h_keys" type="number" value="${h.keys||1}"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDorm('${hid||''}')">Salvar</button></div>`)}
function saveDorm(hid){let h=by(db.dorms,'id',hid);if(!h){h={id:id('h'),utilities:{electric:{on:false},gas:{on:false},water:{on:false}},appliances:[]};db.dorms.push(h)}Object.assign(h,{name:val('h_name'),postal:val('h_postal'),address:val('h_address'),capacity:+val('h_cap'),mode:val('h_mode'),rent:+val('h_rent'),fee:+val('h_fee'),perPerson:+val('h_person'),keys:+val('h_keys')});save();closeModal();render()}
function dormDetail(hid){let h=by(db.dorms,'id',hid),res=db.employees.filter(e=>e.dormId===hid);let total=h.rent+h.fee;view.innerHTML=`<div class="titlebar"><div><button class="btn" onclick="render()">← Lista</button><h1 style="margin-top:10px">${esc(h.name)}</h1><p>${esc(h.postal)} ${esc(h.address)}</p></div><button class="btn" onclick="dormModal('${h.id}')">Editar imóvel</button></div><div class="grid2"><div class="panel"><h3>💰 Custos</h3><p>家賃: <b>${fmt(h.rent)}</b></p><p>Encargo: <b>${fmt(h.fee)}</b></p><p>Total base: <b>${fmt(total)}</b></p><p>Valor por pessoa: <b>${h.mode==='single'?fmt(total):fmt(h.perPerson)}</b></p></div><div class="panel"><h3>👥 Moradores</h3>${res.map(e=>`<p>${esc(e.name)}</p>`).join('')||'<p class="muted">Sem moradores</p>'}</div></div><div class="grid2" style="margin-top:12px"><div class="panel"><h3>🧊 Equipamentos</h3><div id="apps">${h.appliances.map((a,i)=>`<p>${esc(a.type)} — <b>${esc(a.control)}</b> <button class="btn danger" onclick="removeApp('${h.id}',${i})">Remover</button></p>`).join('')}</div><button class="btn" onclick="addApp('${h.id}')">+ Adicionar equipamento</button></div><div class="panel"><h3>⚡🔥💧 Serviços</h3>${['electric','gas','water'].map(k=>utilityRow(h,k)).join('')}</div></div>`}
function utilityRow(h,k){let n={electric:'電気',gas:'ガス',water:'水道'}[k],u=h.utilities[k]||{};return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${n}</b> — ${u.on?'<span class="badge green">Ligado</span>':'<span class="badge amber">Desligado</span>'}<div class="muted">Ligação: ${u.onDate||'—'} · Desligamento: ${u.offDate||'—'}</div><div class="muted">${esc(u.note||'')}</div><button class="btn" onclick="utilityModal('${h.id}','${k}')">Editar</button></div>`}
function addApp(hid){let type=prompt('Tipo (冷蔵庫, 洗濯機, コンロ, 照明...)');if(!type)return;let control=prompt('Número de controle');if(!control)return;if(db.dorms.some(h=>h.appliances.some(a=>a.control===control))){alert('Número de controle já está em uso.');return}by(db.dorms,'id',hid).appliances.push({type,control});save();dormDetail(hid)}function removeApp(hid,i){by(db.dorms,'id',hid).appliances.splice(i,1);save();dormDetail(hid)}
function utilityModal(hid,k){let h=by(db.dorms,'id',hid),u=h.utilities[k]||{},n={electric:'電気',gas:'ガス',water:'水道'}[k];openModal(`<h2>${n}</h2><div class="grid2"><div class="field"><label>Status</label><select id="ut_on"><option value="1" ${u.on?'selected':''}>Ligado</option><option value="0" ${!u.on?'selected':''}>Desligado</option></select></div><div class="field"><label>Data de ligação</label><input id="ut_ondate" type="date" value="${u.onDate||''}"></div><div class="field"><label>Data de desligamento</label><input id="ut_offdate" type="date" value="${u.offDate||''}"></div><div class="field"><label>Endereço para última conta</label><input id="ut_bill" value="${esc(u.billAddress||'')}"></div><div class="field" style="grid-column:1/-1"><label>Observações (立ち合い / 預り金 etc.)</label><textarea id="ut_note">${esc(u.note||'')}</textarea></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveUtility('${hid}','${k}')">Salvar</button></div>`)}function saveUtility(hid,k){by(db.dorms,'id',hid).utilities[k]={on:val('ut_on')==='1',onDate:val('ut_ondate'),offDate:val('ut_offdate'),billAddress:val('ut_bill'),note:val('ut_note')};save();closeModal();dormDetail(hid)}
function masters(){let tabs=[['clients','Clientes/Fábricas'],['sectors','Setores'],['shifts','班/Turnos'],['banks','Bancos/Agências'],['nationalities','Nacionalidades'],['docs','Documentos'],['occs','Ocorrências'],['terms','Desligamento']];view.innerHTML=`<div class="titlebar"><div><h1>Cadastros Mestres</h1><p>Cadastre dados reais para simular o fluxo completo.</p></div></div><div class="tabs" id="mtabs">${tabs.map((x,i)=>`<button class="${i?'':'on'}" onclick="masterTab('${x[0]}',this)">${x[1]}</button>`).join('')}</div><div id="masterbody"></div>`;masterTab('clients',document.querySelector('#mtabs button'))}
function masterTab(t,b){document.querySelectorAll('#mtabs button').forEach(x=>x.classList.remove('on'));b?.classList.add('on');if(t==='clients'){masterbody.innerHTML=masterList('Cliente',db.clients,x=>x.name,`clientModal()`,x=>`clientModal('${x.id}')`)+`<h3 style="margin-top:22px">Fábricas</h3>`+masterList('Fábrica',db.factories,x=>(by(db.clients,'id',x.clientId)?.name||'')+' — '+x.name,`factoryModal()`,x=>`factoryModal('${x.id}')`)}else if(t==='sectors'){masterbody.innerHTML=masterList('Setor',db.sectors,x=>(by(db.factories,'id',x.factoryId)?.name||'')+' — '+x.name,`sectorModal()`,x=>`sectorModal('${x.id}')`)}else if(t==='shifts'){masterbody.innerHTML=masterList('班',db.shifts,x=>(by(db.factories,'id',x.factoryId)?.name||'')+' — '+x.name+' / 昼 '+(x.dayStart||'—')+' / 夜 '+(x.nightStart||'—'),`shiftModal()`,x=>`shiftModal('${x.id}')`)}else if(t==='banks'){masterbody.innerHTML=masterList('Banco',db.banks,x=>x.code+' '+x.name,`bankModal()`,x=>`bankModal('${x.id}')`)+`<h3 style="margin-top:22px">Agências</h3>`+masterList('Agência',db.branches,x=>(by(db.banks,'id',x.bankId)?.name||'')+' — '+x.code+' '+x.name,`branchModal()`,x=>`branchModal('${x.id}')`)}else if(t==='nationalities'){masterbody.innerHTML=masterList('Nacionalidade',db.nationalities,x=>x.ja+' / '+x.pt+' — '+x.lang,`nationalityModal()`,x=>`nationalityModal('${x.id}')`)}else if(t==='docs'){masterbody.innerHTML=masterList('Tipo de documento',db.docTypes,x=>x.ja+' / '+x.pt,`docModal()`,x=>`docModal('${x.id}')`)}else if(t==='occs'){masterbody.innerHTML=masterList('Tipo de ocorrência',db.occTypes,x=>x.ja+' / '+x.pt,`occModal()`,x=>`occModal('${x.id}')`)}else{masterbody.innerHTML=masterList('Motivo de desligamento',db.terminationReasons,x=>x.ja+' / '+x.pt,`termModal()`,x=>`termModal('${x.id}')`)}}
function masterList(label,arr,text,newCall,editFn){return `<div class="panel"><div class="titlebar" style="margin:0 0 10px"><h3>${label}</h3><button class="btn primary" onclick="${newCall}">+ Adicionar</button></div>${arr.map(x=>`<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0"><span>${esc(text(x))}</span><button class="btn" onclick="${editFn(x)}">Editar</button></div>`).join('')||'<div class=empty>Nenhum cadastro</div>'}</div>`}
function simpleModal(title,fields,saveFn){openModal(`<h2>${title}</h2><div class="grid2">${fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[0]==='select'?`<select id="${f[2]}">${f[4]}</select>`:`<input id="${f[2]}" ${f[0]==='number'?'type=number':''} value="${esc(f[3]||'')}">`}</div>`).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="${saveFn}">Salvar</button></div>`)}
function clientModal(idv){let x=by(db.clients,'id',idv)||{};simpleModal('Cliente',[['text','Nome','x_name',x.name]],`saveSimple('clients','${idv||''}',{name:val('x_name'),active:true})`)}function factoryModal(idv){let x=by(db.factories,'id',idv)||{};let opts=db.clients.map(c=>`<option value="${c.id}" ${x.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');simpleModal('Fábrica',[['select','Cliente','x_client','',opts],['text','Nome','x_name',x.name],['text','Código curto','x_code',x.code]],`saveSimple('factories','${idv||''}',{clientId:val('x_client'),name:val('x_name'),code:val('x_code'),active:true})`)}function sectorModal(idv){let x=by(db.sectors,'id',idv)||{};let opts=db.factories.map(c=>`<option value="${c.id}" ${x.factoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');simpleModal('Setor',[['select','Fábrica','x_factory','',opts],['text','Nome','x_name',x.name]],`saveSimple('sectors','${idv||''}',{factoryId:val('x_factory'),name:val('x_name'),active:true})`)}function shiftModal(idv){let x=by(db.shifts,'id',idv)||{};let opts=db.factories.map(c=>`<option value="${c.id}" ${x.factoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');simpleModal('班',[['select','Fábrica','x_factory','',opts],['text','班','x_name',x.name],['text','昼勤 início','x_ds',x.dayStart],['text','昼勤 fim','x_de',x.dayEnd],['text','夜勤 início','x_ns',x.nightStart],['text','夜勤 fim','x_ne',x.nightEnd]],`saveSimple('shifts','${idv||''}',{factoryId:val('x_factory'),name:val('x_name'),dayStart:val('x_ds'),dayEnd:val('x_de'),nightStart:val('x_ns'),nightEnd:val('x_ne'),active:true})`)}function bankModal(idv){let x=by(db.banks,'id',idv)||{};simpleModal('Banco',[['text','Nome','x_name',x.name],['text','Código','x_code',x.code]],`saveSimple('banks','${idv||''}',{name:val('x_name'),code:val('x_code'),active:true})`)}function branchModal(idv){let x=by(db.branches,'id',idv)||{};let opts=db.banks.map(c=>`<option value="${c.id}" ${x.bankId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');simpleModal('Agência',[['select','Banco','x_bank','',opts],['text','Nome','x_name',x.name],['text','店番','x_code',x.code]],`saveSimple('branches','${idv||''}',{bankId:val('x_bank'),name:val('x_name'),code:val('x_code'),active:true})`)}function nationalityModal(idv){let x=by(db.nationalities,'id',idv)||{};simpleModal('Nacionalidade',[['text','Português','x_pt',x.pt],['text','日本語','x_ja',x.ja],['text','Idioma sugerido','x_lang',x.lang]],`saveSimple('nationalities','${idv||''}',{pt:val('x_pt'),ja:val('x_ja'),lang:val('x_lang'),active:true})`)}function docModal(idv){let x=by(db.docTypes,'id',idv)||{};simpleModal('Tipo de documento',[['text','Português','x_pt',x.pt],['text','日本語','x_ja',x.ja]],`saveSimple('docTypes','${idv||''}',{pt:val('x_pt'),ja:val('x_ja'),validity:true,active:true})`)}function occModal(idv){let x=by(db.occTypes,'id',idv)||{};simpleModal('Tipo de ocorrência',[['text','Português','x_pt',x.pt],['text','日本語','x_ja',x.ja]],`saveSimple('occTypes','${idv||''}',{pt:val('x_pt'),ja:val('x_ja'),active:true})`)}function termModal(idv){let x=by(db.terminationReasons,'id',idv)||{};simpleModal('Motivo de desligamento',[['text','Português','x_pt',x.pt],['text','日本語','x_ja',x.ja]],`saveSimple('terminationReasons','${idv||''}',{pt:val('x_pt'),ja:val('x_ja'),active:true})`)}function saveSimple(arr,idv,obj){let x=by(db[arr],'id',idv);if(x)Object.assign(x,obj);else db[arr].push({id:id(arr.slice(0,2)),...obj});save();closeModal();masterTab(arr==='clients'||arr==='factories'?'clients':arr==='sectors'?'sectors':arr==='shifts'?'shifts':arr==='banks'||arr==='branches'?'banks':arr==='nationalities'?'nationalities':arr==='docTypes'?'docs':arr==='occTypes'?'occs':'terms',document.querySelector('#mtabs .on'))}
function settings(){view.innerHTML=`<div class="titlebar"><div><h1>Configurações</h1><p>Homologação e manutenção dos dados locais.</p></div></div><div class="grid2"><div class="panel"><h3>Perfis</h3>${db.profiles.map(p=>`<p><b>${esc(p.name)}</b> ${p.protected?'<span class="badge green">Protegido</span>':''}</p>`).join('')}<button class="btn" onclick="profileModal()">+ Novo perfil</button></div><div class="panel"><h3>Dados de homologação</h3><p>Os registros são mantidos neste navegador.</p><button class="btn" onclick="exportData()">Exportar JSON</button> <button class="btn danger" onclick="resetData()">Restaurar dados iniciais</button></div></div>`}
function profileModal(){openModal(`<h2>Novo perfil</h2><div class="field"><label>Nome</label><input id="pr_name"></div><div class="field"><label>Funcionários</label><select id="pr_emp"><option value="none">Sem acesso</option><option value="view">Visualizar</option><option value="edit">Editar</option></select></div><div class="field"><label>有休</label><select id="pr_yu"><option value="none">Sem acesso</option><option value="view">Visualizar</option><option value="edit">Editar</option></select></div><div class="field"><label>社宅</label><select id="pr_do"><option value="none">Sem acesso</option><option value="view">Visualizar</option><option value="edit">Editar</option></select></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProfile()">Salvar</button></div>`)}function saveProfile(){db.profiles.push({id:id('p'),name:val('pr_name'),protected:false,perms:{employees:val('pr_emp'),yukyu:val('pr_yu'),dorms:val('pr_do')}});save();closeModal();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jabras-homologacao-v1.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Apagar os dados desta homologação neste navegador e restaurar o exemplo inicial?')){localStorage.removeItem(K);db=load();render()}}
function openModal(html){modal.innerHTML=html;modalbg.classList.add('show')}function closeModal(){modalbg.classList.remove('show')}modalbg.addEventListener('click',e=>{if(e.target===modalbg)closeModal()});render();
</script></body></html>
