<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabras Neo — Homologação V1</title><style>:root{--navy:#0b2340;--blue:#2167d7;--bg:#f4f7fb;--line:#dfe6ef;--text:#1a2433;--muted:#718096;--green:#16855f;--amber:#b87817;--red:#c84343;--shadow:0 20px 60px #0b234033}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;padding:8px 10px 20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe6f3;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#1f5fb2;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.titlebar h1{margin:0;font-size:28px}.titlebar p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted)}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-top:1px solid var(--line);text-align:left}.table th{background:#f8fafc;color:var(--muted);font-size:12px}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f8fbff}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.green{background:#e8f6ef;color:var(--green)}.amber{background:#fff2dc;color:var(--amber)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:30px}.backdrop{position:fixed;inset:0;background:#00152d70;opacity:0;pointer-events:none;transition:.2s;z-index:30}.backdrop.show{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(1120px,88vw);background:#fff;z-index:31;transform:translateX(103%);transition:.25s;box-shadow:var(--shadow);display:flex;flex-direction:column}.drawer.show{transform:none}.drawerHead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.drawerHead h2{margin:0}.drawerBody{padding:20px 22px;overflow:auto}.drawerFoot{margin-top:auto;padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:#eef2f7;border-radius:9px;width:38px;height:38px;cursor:pointer}.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);padding:0 4px}.tabs button{border:0;background:none;padding:13px 12px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.on{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.notice{padding:10px 12px;border-radius:10px;background:#fff7e8;color:#875816;margin:10px 0}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand{font-size:0}.brand:before{content:'JN';font-size:18px}.nav button{font-size:0}.nav button:before{content:attr(data-i);font-size:18px}.cards,.grid2{grid-template-columns:1fr}.drawer{width:100%}}</style></head><body><div class="app"><aside class="side"><div class="brand">JABRAS NEO<small>Homologação V1</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><b id="crumb">Dashboard</b><div><select class="btn"><option>Português</option><option>日本語</option></select> <span class="badge green">HOMOLOGAÇÃO</span></div></header><div class="content" id="view"></div></main></div><div class="backdrop" id="backdrop" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"><div class="drawerHead"><h2 id="drawerTitle">Detalhes</h2><button class="close" onclick="closeDrawer()">✕</button></div><div class="tabs" id="drawerTabs"></div><div class="drawerBody" id="drawerBody"></div><div class="drawerFoot" id="drawerFoot"></div></aside><script>const KEY='jabras_homolog_v1_3';const seed={clients:[{id:'c1',name:'JTEKT'}],factories:[{id:'f1',clientId:'c1',name:'岡崎',code:'岡'},{id:'f2',clientId:'c1',name:'花園',code:'花'}],sectors:[{id:'s1',factoryId:'f1',name:'物流課'}],shifts:[{id:'b1',factoryId:'f1',name:'A班',dayStart:'06:25',dayEnd:'15:05',nightStart:'16:10',nightEnd:'00:50'}],banks:[{id:'bk1',name:'三菱UFJ銀行',code:'0005'}],branches:[{id:'br1',bankId:'bk1',name:'岡崎支店',code:'718'}],nationalities:[{id:'n1',pt:'Brasil',ja:'ブラジル',lang:'Português'}],docTypes:[{id:'d1',pt:'Cartão de Residência',ja:'在留カード'}],occTypes:[{id:'o1',pt:'Advertência escrita',ja:'書面注意'}],terminationReasons:[{id:'t1',pt:'Pedido de demissão',ja:'自己都合退職'}],dorms:[{id:'h1',name:'ハイツ一番地101',address:'岡崎市中町1丁目1-7',capacity:2,mode:'single',rent:44550,fee:5000,perPerson:0,appliances:[{type:'冷蔵庫',control:'G005'},{type:'洗濯機',control:'M005'},{type:'コンロ',control:'FP005'},{type:'照明',control:'L015'}],utilities:{electric:{on:true,onDate:'2026-04-01',offDate:'',note:''},gas:{on:true,onDate:'2026-04-01',offDate:'',note:'立ち合い必要'},water:{on:true,onDate:'2026-04-01',offDate:'',note:''}}}],employees:[{id:'e1',name:'Carlos Silva',kana:'カルロス・シルバ',romaji:'CARLOS SILVA',empNo:'1024',jtektNo:'45128',factoryId:'f1',sectorId:'s1',shiftId:'b1',work:'夜勤',status:'active',phone:'090-1234-5678',email:'carlos@example.com',address:'岡崎市中町1丁目1-7',dormId:'h1',bankId:'bk1',branchId:'br1',account:'1234567',social:{status:'加入中',join:'2026-04-01',symbol:'123',number:'456789',pension:'1234-567890'},employment:{status:'加入中',number:'1234-567890-1',join:'2026-04-01',loss:''},vehicle:{maker:'Toyota',model:'Prius',plate:'岡崎 300 あ 12-34',active:true,shaken:'2027-01-20',hoken:'2027-03-31'},dependents:[{name:'Maria Silva',relation:'配偶者',birth:'1990-04-12',social:true}],documents:[{type:'在留カード',validUntil:'2028-05-31'}],history:[{date:'2026-04-01',text:'Admissão cadastrada'}]}],yukyu:[{employeeId:'e1',lots:[{acq:'2025-09-24',expire:'2027-09-23',granted:10,used:5},{acq:'2026-09-24',expire:'2028-09-23',granted:11,used:0}],forecast:[{date:'2026-09-10',status:'open'}]}]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed),page='dashboard';const by=(a,id)=>a.find(x=>x.id===id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=p=>p+Math.random().toString(36).slice(2,9),fmt=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const pages=[['dashboard','▦','Dashboard'],['employees','👥','Funcionários'],['yukyu','休','有休管理'],['dorms','⌂','社宅管理'],['masters','⚙','Cadastros Mestres']];function render(){nav.innerHTML=pages.map(p=>`<button data-i="${p[1]}" class="${page===p[0]?'on':''}" onclick="page='${p[0]}';render()">${p[1]} &nbsp; ${p[2]}</button>`).join('');crumb.textContent=pages.find(p=>p[0]===page)[2];({dashboard:dash,employees:employees,yukyu:yukyu,dorms:dorms,masters:masters}[page])()}function dash(){view.innerHTML=`<div class="titlebar"><div><h1>Dashboard</h1><p>Ambiente funcional de homologação.</p></div></div><div class="cards"><div class="card"><span class="muted">Funcionários ativos</span><b>${db.employees.length}</b></div><div class="card"><span class="muted">社宅</span><b>${db.dorms.length}</b></div><div class="card"><span class="muted">Fábricas</span><b>${db.factories.length}</b></div><div class="card"><span class="muted">Cadastros mestres</span><b>${db.clients.length+db.banks.length+db.docTypes.length}</b></div></div>`}function openDrawer(title,tabs,body,foot){drawerTitle.textContent=title;drawerTabs.innerHTML=(tabs||[]).map((t,i)=>`<button class="${i===0?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');drawerBody.innerHTML=body||'';drawerFoot.innerHTML=foot||'';backdrop.classList.add('show');drawer.classList.add('show')}function closeDrawer(){backdrop.classList.remove('show');drawer.classList.remove('show')}function employees(){view.innerHTML=`<div class="titlebar"><div><h1>Funcionários</h1><p>Clique em um funcionário para abrir o drawer completo.</p></div><button class="btn primary" onclick="newEmployee()">+ Novo funcionário</button></div><div class="tablewrap"><table class="table"><thead><tr><th>名前 / フリガナ</th><th>社員番号</th><th>JTEKT社員番号</th><th>Fábrica</th><th>Status</th></tr></thead><tbody>${db.employees.map(e=>`<tr onclick="openEmployee('${e.id}')"><td><b>${e.name}</b><div class="muted">${e.kana}</div></td><td>${e.empNo}</td><td>${e.jtektNo||''}</td><td>${by(db.factories,e.factoryId)?.name||''}</td><td><span class="badge green">Ativo</span></td></tr>`).join('')}</tbody></table></div>`}const empTabs=[['dados','👤 Dados'],['trabalho','💼 Trabalho'],['moradia','🏠 Moradia'],['documentos','📄 Documentos'],['seguros','🛡️ Seguros'],['pagamento','💰 Pagamento'],['veiculo','🚗 Veículo'],['dependentes','👨‍👩‍👧 Dependentes'],['historico','📋 Histórico']];function openEmployee(id,tab='dados'){let e=by(db.employees,id);openDrawer(`${e.name} — ${e.empNo}`,empTabs,'','<button class="btn" onclick="closeDrawer()">Fechar</button>');drawerTabs.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>openEmployee(id,b.dataset.tab)});let f=by(db.factories,e.factoryId),s=by(db.sectors,e.sectorId),sh=by(db.shifts,e.shiftId),d=by(db.dorms,e.dormId),bk=by(db.banks,e.bankId),br=by(db.branches,e.branchId),h='';if(tab==='dados')h=`<div class="grid2"><div class="panel"><h3>Dados pessoais</h3><p><b>名前:</b> ${e.name}</p><p><b>フリガナ:</b> ${e.kana}</p><p><b>ローマ字:</b> ${e.romaji||'—'}</p></div><div class="panel"><h3>Contato</h3><p>${e.phone||'—'}</p><p>${e.email||'—'}</p><p>${e.address||'—'}</p></div></div>`;if(tab==='trabalho')h=`<div class="grid2"><div class="panel"><h3>Alocação</h3><p>社員番号: ${e.empNo}</p><p>JTEKT社員番号: ${e.jtektNo||'—'}</p><p>Fábrica: ${f?.name||'—'}</p><p>Setor: ${s?.name||'—'}</p></div><div class="panel"><h3>Turno</h3><p>班: ${sh?.name||'—'}</p><p>勤務: ${e.work||'—'}</p></div></div><div class="notice">勤務形態 separado foi removido. O padrão é 班 + 勤務; 常昼 e 常夜 não exigem 班.</div>`;if(tab==='moradia')h=`<div class="panel"><h3>Moradia atual</h3><p><b>${d?.name||'自宅'}</b></p><p>${d?.address||e.address||'—'}</p>${d?`<p>Aluguel + encargo: ${fmt(d.rent+d.fee)}</p>`:''}</div>`;if(tab==='documentos')h=`<div class="tablewrap"><table class="table"><thead><tr><th>Documento</th><th>Validade</th></tr></thead><tbody>${(e.documents||[]).map(x=>`<tr><td>${x.type}</td><td>${x.validUntil||'—'}</td></tr>`).join('')}</tbody></table></div>`;if(tab==='seguros')h=`<div class="grid2"><div class="panel"><h3>社会保険</h3><p>Status: <b>${e.social?.status||'未加入'}</b></p><p>社会保険加入日: ${e.social?.join||'—'}</p><p>健康保険記号: ${e.social?.symbol||'—'}</p><p>健康保険番号: ${e.social?.number||'—'}</p><p>基礎年金番号: ${e.social?.pension||'—'}</p></div><div class="panel"><h3>雇用保険</h3><p>Status: <b>${e.employment?.status||'未加入'}</b></p><p>雇用保険被保険者番号: ${e.employment?.number||'—'}</p><p>加入日: ${e.employment?.join||'—'}</p><p>喪失日: ${e.employment?.loss||'—'}</p></div></div>`;if(tab==='pagamento')h=`<div class="grid2"><div class="panel"><h3>Banco</h3><p>${bk?.name||'—'} (${bk?.code||'—'})</p><p>${br?.name||'—'} / 店番 ${br?.code||'—'}</p><p>口座番号: ${e.account||'—'}</p></div></div>`;if(tab==='veiculo')h=e.vehicle?`<div class="panel"><h3>${e.vehicle.maker} ${e.vehicle.model}</h3><p>${e.vehicle.plate}</p><p>Status: <b>${e.vehicle.active?'Ativo':'Histórico'}</b></p>${e.vehicle.active?`<p>車検: ${e.vehicle.shaken||'—'}</p><p>任意保険: ${e.vehicle.hoken||'—'}</p>`:'<p class="muted">Sem pendências de 車検 / 任意保険.</p>'}<button class="btn" onclick="eVehicle('${e.id}')">${e.vehicle.active?'Encerrar uso':'Reativar'}</button></div>`:'<div class="empty">Nenhum veículo</div>';if(tab==='dependentes')h=`<div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Relação</th><th>Nascimento</th><th>社保扶養</th></tr></thead><tbody>${(e.dependents||[]).map(x=>`<tr><td>${x.name}</td><td>${x.relation}</td><td>${x.birth}</td><td>${x.social?'Sim':'Não'}</td></tr>`).join('')}</tbody></table></div>`;if(tab==='historico')h=(e.history||[]).map(x=>`<div class="panel" style="margin-bottom:8px"><b>${x.date}</b><div>${x.text}</div></div>`).join('');drawerBody.innerHTML=h}function eVehicle(id){let e=by(db.employees,id);e.vehicle.active=!e.vehicle.active;save();openEmployee(id,'veiculo')}function newEmployee(){openDrawer('Novo funcionário',[],`<div class="grid2"><div class="field"><label>名前 *</label><input id="nn"></div><div class="field"><label>社員番号 *</label><input id="ne"></div><div class="field"><label>フリガナ</label><input id="nk"></div><div class="field"><label>Fábrica</label><select id="nf"><option value="">—</option>${db.factories.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div></div>`,`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createEmployee()">Cadastrar</button>`)}function createEmployee(){if(!nn.value.trim()||!ne.value.trim())return alert('名前 e 社員番号 são obrigatórios');if(db.employees.some(e=>e.empNo===ne.value.trim()))return alert('社員番号 já utilizado');db.employees.push({id:uid('e'),name:nn.value,kana:nk.value,empNo:ne.value,jtektNo:'',factoryId:nf.value,status:'draft',social:{status:'未加入'},employment:{status:'未加入'},dependents:[],documents:[],history:[]});save();closeDrawer();render()}function yukyu(){view.innerHTML=`<div class="titlebar"><div><h1>有休管理</h1><p>Visão administrativa.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Funcionário</th><th>Saldo</th><th>Próxima folga</th></tr></thead><tbody>${db.employees.map(e=>{let y=db.yukyu.find(x=>x.employeeId===e.id)||{lots:[],forecast:[]};return `<tr onclick="openY('${e.id}')"><td>${e.name}</td><td>${y.lots.reduce((a,l)=>a+l.granted-l.used,0)}</td><td>${y.forecast.find(x=>x.status==='open')?.date||'—'}</td></tr>`}).join('')}</tbody></table></div>`}function openY(id){let e=by(db.employees,id),y=db.yukyu.find(x=>x.employeeId===id)||{lots:[]};openDrawer(`有休 — ${e.name}`,[],`<div class="tablewrap"><table class="table"><thead><tr><th>Aquisição</th><th>Validade</th><th>Recebidos</th><th>Usados</th><th>Saldo</th></tr></thead><tbody>${[...y.lots].sort((a,b)=>b.acq.localeCompare(a.acq)).map(l=>`<tr><td>${l.acq}</td><td>${l.expire}</td><td>${l.granted}</td><td>${l.used}</td><td>${l.granted-l.used}</td></tr>`).join('')}</tbody></table></div><div class="notice">Consumo do lote mais recente para o mais antigo.</div>`,`<button class="btn" onclick="closeDrawer()">Fechar</button>`)}function dorms(){view.innerHTML=`<div class="titlebar"><div><h1>社宅管理</h1><p>Lista de imóveis.</p></div><button class="btn primary" onclick="newDorm()">+ Novo 社宅</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Imóvel</th><th>Moradores</th><th>Custo base</th><th>電気</th><th>ガス</th><th>水道</th></tr></thead><tbody>${db.dorms.map(d=>`<tr onclick="openDorm('${d.id}')"><td><b>${d.name}</b><div class="muted">${d.address}</div></td><td>${db.employees.filter(e=>e.dormId===d.id).length}/${d.mode==='single'?1:d.capacity}</td><td>${fmt(d.rent+d.fee)}</td><td>${d.utilities.electric.on?'●':'○'}</td><td>${d.utilities.gas.on?'●':'○'}</td><td>${d.utilities.water.on?'●':'○'}</td></tr>`).join('')}</tbody></table></div>`}function openDorm(id){let d=by(db.dorms,id),tabs=[['dados','🏠 Dados'],['equip','🧊 Equipamentos'],['serv','⚡ Serviços']];openDrawer(d.name,tabs,'','<button class="btn" onclick="closeDrawer()">Fechar</button>');function tab(t){drawerTabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));if(t==='dados')drawerBody.innerHTML=`<div class="grid2"><div class="panel"><h3>Custos</h3><p>Aluguel: ${fmt(d.rent)}</p><p>Encargo: ${fmt(d.fee)}</p><p>Total: ${fmt(d.rent+d.fee)}</p></div><div class="panel"><h3>Ocupação</h3><p>${d.mode==='single'?'Individual':'Compartilhado'}</p><p>Capacidade física: ${d.capacity}</p></div></div>`;if(t==='equip')drawerBody.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Tipo</th><th>Nº controle</th></tr></thead><tbody>${d.appliances.map(a=>`<tr><td>${a.type}</td><td>${a.control}</td></tr>`).join('')}</tbody></table></div>`;if(t==='serv')drawerBody.innerHTML=['electric','gas','water'].map(k=>`<div class="panel" style="margin-bottom:8px"><h3>${{electric:'電気',gas:'ガス',water:'水道'}[k]}</h3><p>Status: ${d.utilities[k].on?'Ligado':'Desligado'}</p><p>Ligação: ${d.utilities[k].onDate||'—'}</p><p>Desligamento: ${d.utilities[k].offDate||'—'}</p><p>Observações: ${d.utilities[k].note||'—'}</p></div>`).join('')}drawerTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));tab('dados')}function newDorm(){openDrawer('Novo 社宅',[],`<div class="grid2"><div class="field"><label>Nome *</label><input id="dn"></div><div class="field"><label>Endereço</label><input id="da"></div><div class="field"><label>Capacidade</label><input id="dc" type="number" value="1"></div><div class="field"><label>Ocupação</label><select id="dm"><option value="single">Individual</option><option value="shared">Compartilhado</option></select></div><div class="field"><label>Aluguel</label><input id="dr" type="number"></div><div class="field"><label>Encargo</label><input id="df" type="number"></div></div>`,`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createDorm()">Cadastrar</button>`)}function createDorm(){if(!dn.value.trim())return alert('Nome obrigatório');db.dorms.push({id:uid('h'),name:dn.value,address:da.value,capacity:+dc.value||1,mode:dm.value,rent:+dr.value||0,fee:+df.value||0,appliances:[],utilities:{electric:{on:false,onDate:'',offDate:'',note:''},gas:{on:false,onDate:'',offDate:'',note:''},water:{on:false,onDate:'',offDate:'',note:''}}});save();closeDrawer();render()}function masters(){let groups=[['Clientes','clients','name'],['Fábricas','factories','name'],['Setores','sectors','name'],['班','shifts','name'],['Bancos','banks','name'],['Agências','branches','name'],['Nacionalidades','nationalities','pt'],['Tipos de documento','docTypes','pt'],['Tipos de ocorrência','occTypes','pt'],['Motivos de desligamento','terminationReasons','pt']];view.innerHTML=`<div class="titlebar"><div><h1>Cadastros Mestres</h1><p>Todos acessíveis por drawer.</p></div></div><div class="grid2">${groups.map(g=>`<div class="panel"><h3>${g[0]}</h3><p class="muted">${db[g[1]].length} registros</p><button class="btn primary" onclick="openMaster('${g[1]}','${g[2]}','${g[0]}')">Abrir</button></div>`).join('')}</div>`}function openMaster(key,nameKey,title){openDrawer(title,[],`<div class="actions" style="justify-content:flex-start;margin:0 0 12px"><button class="btn primary" onclick="addMaster('${key}','${nameKey}','${title}')">+ Novo</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Nome</th></tr></thead><tbody>${db[key].map(x=>`<tr><td>${x[nameKey]}</td></tr>`).join('')}</tbody></table></div>`,`<button class="btn" onclick="closeDrawer()">Fechar</button>`)}function addMaster(key,nameKey,title){let n=prompt('Novo registro — '+title);if(!n)return;let o={id:uid('m')};o[nameKey]=n;if(key==='factories')o.clientId=db.clients[0]?.id||'';if(key==='sectors'||key==='shifts')o.factoryId=db.factories[0]?.id||'';if(key==='branches')o.bankId=db.banks[0]?.id||'';db[key].push(o);save();openMaster(key,nameKey,title)}render();</script></body></html>
