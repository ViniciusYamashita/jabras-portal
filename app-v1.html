nd:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-top:1px solid var(--line);text-align:left}.table th{background:#f8fafc;color:var(--muted);font-size:12px}.table tbody tr.click{cursor:pointer}.table tbody tr.click:hover{background:#f8fbff}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.green{background:#e7f6ef;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px;min-width:0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;max-width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:78px}.master-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.master-section h2{margin:0 0 4px;font-size:18px}.master-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.master-item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fbfcfe}.master-item strong{display:block}.master-item small{color:var(--muted)}.backdrop{position:fixed;inset:0;background:#00152d70;opacity:0;pointer-events:none;transition:.2s;z-index:30}.backdrop.show{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;height:100vh;width:78vw;max-width:78vw;background:#fff;z-index:31;transform:translateX(103%);transition:.25s;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}.drawer.show{transform:none}.drawerHead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.drawerHead h2{margin:0}.drawerBody{padding:20px 22px;overflow:auto;overflow-x:hidden}.drawerFoot{margin-top:auto;padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);padding:0 6px}.tabs button{border:0;background:none;padding:13px 11px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer;flex:0 0 auto}.tabs button.on{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.close{border:0;background:#eef2f7;border-radius:9px;width:38px;height:38px;cursor:pointer}.hier-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.hier-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.hier-sub{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.hier-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-block;background:#eef3f9;border-radius:999px;padding:5px 8px;font-size:12px;margin:3px 4px 0 0}.utility-status{display:flex;gap:18px;align-items:center;padding:8px 0 14px}.utility-status label{display:flex;align-items:center;gap:6px;font-weight:700}.notice{padding:10px 12px;border-radius:10px;background:#fff7e8;color:#875816;margin:10px 0}@media(max-width:900px){.app{grid-template-columns:74px 1fr}.brand{font-size:0}.brand:before{content:'JN';font-size:18px}.nav button{font-size:0}.nav button:before{content:attr(data-i);font-size:18px}.cards,.grid2,.master-items{grid-template-columns:1fr}.drawer{width:100vw;max-width:100vw}}</style></head><body><div class="app"><aside class="side"><div class="brand">JABRAS NEO<small>Homologação V1</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><b id="crumb"></b><span class="badge green">HOMOLOGAÇÃO</span></header><div class="content" id="view"></div></main></div><div class="backdrop" id="backdrop" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"><div class="drawerHead"><h2 id="drawerTitle"></h2><button class="close" onclick="closeDrawer()">✕</button></div><div class="tabs" id="drawerTabs"></div><div class="drawerBody" id="drawerBody"></div><div class="drawerFoot" id="drawerFoot"></div></aside><script>const KEY='jabras_homolog_v1_5';const seed={clients:[{id:'c1',name:'JTEKT'}],factories:[{id:'f1',clientId:'c1',name:'岡崎',code:'岡'},{id:'f2',clientId:'c1',name:'花園',code:'花'}],sectors:[{id:'s1',factoryId:'f1',name:'物流課'}],shifts:[{id:'b1',factoryId:'f1',name:'A班',dayStart:'06:25',dayEnd:'15:05',nightStart:'16:10',nightEnd:'00:50'}],banks:[{id:'bk1',name:'三菱UFJ銀行',code:'0005'}],branches:[{id:'br1',bankId:'bk1',name:'岡崎支店',code:'718'}],docTypes:[{id:'d1',ja:'在留カード',pt:'Cartão de Residência'}],dorms:[{id:'h1',name:'ハイツ一番地101',address:'岡崎市中町1丁目1-7',capacity:2,rent:44550,fee:5000,perPerson:0,appliances:[{type:'冷蔵庫',control:'G005'}],utilities:{electric:{on:true,onDate:'2026-04-01',offDate:'',note:''},gas:{on:true,onDate:'2026-04-01',offDate:'',note:'立ち合い必要'},water:{on:true,onDate:'2026-04-01',offDate:'',note:''}}}],employees:[{id:'e1',name:'Carlos Silva',kana:'カルロス・シルバ',romaji:'CARLOS SILVA',empNo:'1024',jtektNo:'45128',factoryId:'f1',sectorId:'s1',shiftId:'b1',work:'夜勤',status:'active',phone:'090-1234-5678',email:'carlos@example.com',address:'岡崎市中町1丁目1-7',dormId:'h1',bankId:'bk1',branchId:'br1',account:'1234567',social:{status:'加入中',join:'2026-04-01',symbol:'123',number:'456789',pension:'1234-567890'},employment:{status:'加入中',number:'1234-567890-1',join:'2026-04-01',loss:''},vehicle:{maker:'Toyota',model:'Prius',plate:'岡崎 300 あ 12-34',active:true,shaken:'2027-01-20',hoken:'2027-03-31'},documents:[{type:'在留カード',validUntil:'2028-05-31'}],dependents:[{name:'Maria Silva',relation:'配偶者',birth:'1990-04-12'}],history:[{date:'2026-04-01',text:'Admissão cadastrada'}]}],yukyu:[{employeeId:'e1',lots:[{acq:'2025-09-24',expire:'2027-09-23',granted:10,used:5},{acq:'2026-09-24',expire:'2028-09-23',granted:11,used:0}],forecast:[{date:'2026-09-10',status:'open'}]}]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed),page='dashboard';const $=id=>document.getElementById(id),by=(a,id)=>a.find(x=>x.id===id),uid=p=>p+Math.random().toString(36).slice(2,9),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),v=id=>$(id)?.value??'',fmt=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const pages=[['dashboard','▦','Dashboard'],['employees','👥','Funcionários'],['yukyu','休','有休管理'],['dorms','⌂','社宅管理'],['masters','⚙','Cadastros Mestres']];const empTabs=[['dados','👤 Dados'],['trabalho','💼 Trabalho'],['moradia','🏠 Moradia'],['documentos','📄 Documentos'],['seguros','🛡️ Seguros'],['pagamento','💰 Pagamento'],['veiculo','🚗 Veículo'],['dependentes','👨‍👩‍👧 Dependentes'],['historico','📋 Histórico']];function render(){nav.innerHTML=pages.map(p=>`<button data-i="${p[1]}" class="${page===p[0]?'on':''}" onclick="page='${p[0]}';render()">${p[1]} &nbsp; ${p[2]}</button>`).join('');crumb.textContent=pages.find(p=>p[0]===page)[2];({dashboard:dash,employees:employees,yukyu:yukyu,dorms:dorms,masters:masters}[page])()}function openDrawer(title,tabs=[]){drawerTitle.textContent=title;drawerTabs.innerHTML=tabs.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('');drawerBody.innerHTML='';drawerFoot.innerHTML='';backdrop.classList.add('show');drawer.classList.add('show')}function closeDrawer(){backdrop.classList.remove('show');drawer.classList.remove('show')}function dash(){view.innerHTML=`<div class="titlebar"><div><h1>Dashboard</h1><p>Homologação funcional com dados gravados neste navegador.</p></div></div><div class="cards"><div class="card"><span class="muted">Funcionários</span><b>${db.employees.length}</b></div><div class="card"><span class="muted">Fábricas</span><b>${db.factories.length}</b></div><div class="card"><span class="muted">社宅</span><b>${db.dorms.length}</b></div><div class="card"><span class="muted">Bancos</span><b>${db.banks.length}</b></div></div>`}function employees(){view.innerHTML=`<div class="titlebar"><div><h1>Funcionários</h1><p>Clique para abrir a ficha completa.</p></div><button class="btn primary" onclick="newEmployee()">+ Novo funcionário</button></div><div class="tablewrap"><table class="table"><thead><tr><th>名前 / フリガナ</th><th>社員番号</th><th>Fábrica</th><th>Status</th></tr></thead><tbody>${db.employees.map(e=>`<tr class="click" onclick="openEmployee('${e.id}')"><td><b>${e.name}</b><div class="muted">${e.kana||''}</div></td><td>${e.empNo}</td><td>${by(db.factories,e.factoryId)?.name||'—'}</td><td><span class="badge green">${e.status==='active'?'Ativo':'Pré-cadastro'}</span></td></tr>`).join('')}</tbody></table></div>`}function newEmployee(){openDrawer('Novo funcionário');drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>名前 *</label><input id="n_name"></div><div class="field"><label>フリガナ</label><input id="n_kana"></div><div class="field"><label>社員番号 *</label><input id="n_no"></div><div class="field"><label>JTEKT社員番号</label><input id="n_j"></div></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createEmployee()">Criar</button>`}function createEmployee(){const name=v('n_name').trim(),no=v('n_no').trim();if(!name||!no)return alert('名前 e 社員番号 são obrigatórios.');if(db.employees.some(e=>e.empNo===no))return alert('社員番号 já utilizado.');const e={id:uid('e'),name,kana:v('n_kana'),empNo:no,jtektNo:v('n_j'),status:'draft',social:{},employment:{},vehicle:{active:true},documents:[],dependents:[],history:[]};db.employees.push(e);save();render();openEmployee(e.id)}function openEmployee(id,tab='dados'){const e=by(db.employees,id);openDrawer(`${e.name} — ${e.empNo}`,empTabs);drawerTabs.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>openEmployee(id,b.dataset.tab)});drawerBody.innerHTML=employeeForm(e,tab);drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveEmployee('${id}','${tab}')">Salvar</button>`}function opts(arr,id){return `<option value="">—</option>`+arr.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.name}</option>`).join('')}function employeeForm(e,t){if(t==='dados')return `<div class="grid2"><div class="field"><label>名前</label><input id="e_name" value="${e.name||''}"></div><div class="field"><label>フリガナ</label><input id="e_kana" value="${e.kana||''}"></div><div class="field"><label>名前（ローマ字）</label><input id="e_romaji" value="${e.romaji||''}"></div><div class="field"><label>電話番号</label><input id="e_phone" value="${e.phone||''}"></div><div class="field"><label>メール</label><input id="e_email" value="${e.email||''}"></div><div class="field"><label>住所</label><input id="e_address" value="${e.address||''}"></div></div>`;if(t==='trabalho')return `<div class="grid2"><div class="field"><label>社員番号</label><input id="e_no" value="${e.empNo||''}"></div><div class="field"><label>JTEKT社員番号</label><input id="e_j" value="${e.jtektNo||''}"></div><div class="field"><label>Fábrica</label><select id="e_factory">${opts(db.factories,e.factoryId)}</select></div><div class="field"><label>Setor</label><select id="e_sector">${opts(db.sectors.filter(x=>x.factoryId===e.factoryId),e.sectorId)}</select></div><div class="field"><label>班</label><select id="e_shift">${opts(db.shifts.filter(x=>x.factoryId===e.factoryId),e.shiftId)}</select></div><div class="field"><label>勤務</label><select id="e_work">${['昼勤','夜勤','常昼','常夜'].map(x=>`<option ${e.work===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`;if(t==='moradia')return `<div class="grid2"><div class="field"><label>Moradia</label><select id="e_dorm">${opts(db.dorms,e.dormId)}</select></div><div class="field"><label>Endereço</label><input id="e_address2" value="${e.address||''}"></div></div>`;if(t==='documentos')return `${(e.documents||[]).map((d,i)=>`<div class="panel"><b>${d.type}</b><div class="field"><label>Validade</label><input type="date" id="doc_${i}" value="${d.validUntil||''}"></div></div>`).join('')||'<p class="muted">Nenhum documento.</p>'}`;if(t==='seguros')return `<div class="grid2"><div class="panel"><h3>社会保険</h3>${ins('soc',e.social||{})}</div><div class="panel"><h3>雇用保険</h3><div class="field"><label>Status</label><input id="emp_status" value="${e.employment?.status||''}"></div><div class="field"><label>雇用保険被保険者番号</label><input id="emp_number" value="${e.employment?.number||''}"></div><div class="field"><label>加入日</label><input type="date" id="emp_join" value="${e.employment?.join||''}"></div><div class="field"><label>喪失日</label><input type="date" id="emp_loss" value="${e.employment?.loss||''}"></div></div></div>`;if(t==='pagamento')return `<div class="grid2"><div class="field"><label>Banco</label><select id="e_bank">${opts(db.banks,e.bankId)}</select></div><div class="field"><label>Agência</label><select id="e_branch">${opts(db.branches.filter(x=>!e.bankId||x.bankId===e.bankId),e.branchId)}</select></div><div class="field"><label>口座番号</label><input id="e_account" value="${e.account||''}"></div></div>`;if(t==='veiculo')return `<div class="grid2"><div class="field"><label>Fabricante</label><input id="v_maker" value="${e.vehicle?.maker||''}"></div><div class="field"><label>Modelo</label><input id="v_model" value="${e.vehicle?.model||''}"></div><div class="field"><label>Placa</label><input id="v_plate" value="${e.vehicle?.plate||''}"></div><div class="field"><label>車検</label><input type="date" id="v_shaken" value="${e.vehicle?.shaken||''}"></div><div class="field"><label>任意保険</label><input type="date" id="v_hoken" value="${e.vehicle?.hoken||''}"></div><div class="field"><label>Status</label><select id="v_active"><option value="1" ${e.vehicle?.active!==false?'selected':''}>Em uso</option><option value="0" ${e.vehicle?.active===false?'selected':''}>Venda / encerrado</option></select></div></div>`;if(t==='dependentes')return `${(e.dependents||[]).map(d=>`<div class="panel"><b>${d.name}</b><p>${d.relation||''} · ${d.birth||''}</p></div>`).join('')||'<p class="muted">Nenhum dependente.</p>'}`;return `<div class="panel">${(e.history||[]).map(h=>`<p><b>${h.date}</b> — ${h.text}</p>`).join('')||'Sem histórico.'}</div>`}function ins(p,s){return `<div class="field"><label>Status</label><input id="${p}_status" value="${s.status||''}"></div><div class="field"><label>社会保険加入日</label><input type="date" id="${p}_join" value="${s.join||''}"></div><div class="field"><label>健康保険記号</label><input id="${p}_symbol" value="${s.symbol||''}"></div><div class="field"><label>健康保険番号</label><input id="${p}_number" value="${s.number||''}"></div><div class="field"><label>基礎年金番号</label><input id="${p}_pension" value="${s.pension||''}"></div>`}function saveEmployee(id,t){const e=by(db.employees,id);if(t==='dados')Object.assign(e,{name:v('e_name'),kana:v('e_kana'),romaji:v('e_romaji'),phone:v('e_phone'),email:v('e_email'),address:v('e_address')});if(t==='trabalho')Object.assign(e,{empNo:v('e_no'),jtektNo:v('e_j'),factoryId:v('e_factory'),sectorId:v('e_sector'),shiftId:v('e_shift'),work:v('e_work')});if(t==='moradia')Object.assign(e,{dormId:v('e_dorm'),address:v('e_address2')});if(t==='seguros'){e.social={status:v('soc_status'),join:v('soc_join'),symbol:v('soc_symbol'),number:v('soc_number'),pension:v('soc_pension')};e.employment={status:v('emp_status'),number:v('emp_number'),join:v('emp_join'),loss:v('emp_loss')}}if(t==='pagamento')Object.assign(e,{bankId:v('e_bank'),branchId:v('e_branch'),account:v('e_account')});if(t==='veiculo')e.vehicle={maker:v('v_maker'),model:v('v_model'),plate:v('v_plate'),shaken:v('v_shaken'),hoken:v('v_hoken'),active:v('v_active')==='1'};e.history=e.history||[];e.history.unshift({date:new Date().toISOString().slice(0,10),text:`Aba ${t} alterada`});save();render();openEmployee(id,t)}function yukyu(){view.innerHTML=`<div class="titlebar"><div><h1>有休管理</h1><p>Controle administrativo por funcionário.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Funcionário</th><th>Saldo</th><th>Próxima previsão</th></tr></thead><tbody>${db.employees.map(e=>{const y=db.yukyu.find(x=>x.employeeId===e.id),s=(y?.lots||[]).reduce((a,l)=>a+l.granted-l.used,0);return `<tr class="click" onclick="openYukyu('${e.id}')"><td>${e.name}</td><td>${s}</td><td>${y?.forecast?.[0]?.date||'—'}</td></tr>`}).join('')}</tbody></table></div>`}function openYukyu(id){const e=by(db.employees,id),y=db.yukyu.find(x=>x.employeeId===id)||{employeeId:id,lots:[],forecast:[]};if(!db.yukyu.includes(y))db.yukyu.push(y);openDrawer(`有休 — ${e.name}`);drawerBody.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Aquisição</th><th>Validade</th><th>Recebido</th><th>Usado</th><th>Saldo</th></tr></thead><tbody>${y.lots.map(l=>`<tr><td>${l.acq}</td><td>${l.expire}</td><td>${l.granted}</td><td>${l.used}</td><td>${l.granted-l.used}</td></tr>`).join('')}</tbody></table></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button>`}function dorms(){view.innerHTML=`<div class="titlebar"><div><h1>社宅管理</h1><p>Lista de imóveis.</p></div><button class="btn primary" onclick="newDorm()">+ Novo 社宅</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Imóvel</th><th>Endereço</th><th>Capacidade</th><th>Custo</th></tr></thead><tbody>${db.dorms.map(d=>`<tr class="click" onclick="openDorm('${d.id}')"><td><b>${d.name}</b></td><td>${d.address}</td><td>${d.capacity}</td><td>${fmt(d.rent+d.fee)}</td></tr>`).join('')}</tbody></table></div>`}function newDorm(){openDrawer('Novo 社宅');drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>Nome</label><input id="d_name"></div><div class="field"><label>Endereço</label><input id="d_address"></div><div class="field"><label>Capacidade</label><input type="number" id="d_cap" value="1"></div><div class="field"><label>Aluguel</label><input type="number" id="d_rent"></div><div class="field"><label>Encargo</label><input type="number" id="d_fee"></div></div>`;drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="createDorm()">Criar</button>`}function createDorm(){db.dorms.push({id:uid('h'),name:v('d_name'),address:v('d_address'),capacity:Number(v('d_cap')||1),rent:Number(v('d_rent')),fee:Number(v('d_fee')),perPerson:0,appliances:[],utilities:{electric:{on:true},gas:{on:true},water:{on:true}}});save();closeDrawer();render()}function openDorm(id,tab='dados'){const d=by(db.dorms,id),tabs=[['dados','🏠 Dados'],['equip','🧊 Equipamentos'],['serv','⚡ Serviços']];openDrawer(d.name,tabs);drawerTabs.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>openDorm(id,b.dataset.tab)});if(tab==='dados')drawerBody.innerHTML=`<div class="grid2"><div class="field"><label>Nome</label><input id="od_name" value="${d.name}"></div><div class="field"><label>Endereço</label><input id="od_address" value="${d.address}"></div><div class="field"><label>Capacidade</label><input type="number" id="od_cap" value="${d.capacity}"></div><div class="field"><label>Aluguel empresa</label><input type="number" id="od_rent" value="${d.rent}"></div><div class="field"><label>Encargo</label><input type="number" id="od_fee" value="${d.fee}"></div><div class="field"><label>Valor por pessoa</label><input type="number" id="od_pp" value="${d.perPerson||0}"></div></div>`;if(tab==='equip')drawerBody.innerHTML=`${d.appliances.map(a=>`<div class="panel"><b>${a.type}</b> — ${a.control}</div>`).join('')||'<p class="muted">Nenhum equipamento.</p>'}`;if(tab==='serv')drawerBody.innerHTML=['electric','gas','water'].map(k=>utilityBlock(k,d.utilities[k]||{})).join('');drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveDorm('${id}','${tab}')">Salvar</button>`}function utilityBlock(k,u){const label=k==='electric'?'⚡ 電気':k==='gas'?'🔥 ガス':'💧 水道';return `<div class="panel"><h3>${label}</h3><div class="utility-status"><label><input type="radio" name="${k}_status" id="${k}_on" ${u.on!==false?'checked':''}> Ligado</label><label><input type="radio" name="${k}_status" id="${k}_off" ${u.on===false?'checked':''}> Desligado</label></div><div class="grid2"><div class="field"><label>Ligação</label><input type="date" id="${k}_onDate" value="${u.onDate||''}"></div><div class="field"><label>Desligamento</label><input type="date" id="${k}_offDate" value="${u.offDate||''}"></div><div class="field"><label>Observações / 立ち合い / 預り金</label><textarea id="${k}_note">${u.note||''}</textarea></div><div class="field"><label>Endereço da última conta</label><input id="${k}_last" value="${u.lastBillAddress||''}"></div></div></div>`}function saveDorm(id,t){const d=by(db.dorms,id);if(t==='dados')Object.assign(d,{name:v('od_name'),address:v('od_address'),capacity:Number(v('od_cap')),rent:Number(v('od_rent')),fee:Number(v('od_fee')),perPerson:Number(v('od_pp'))});if(t==='serv'){for(const k of ['electric','gas','water']){const off=$(k+'_off').checked,offDate=v(k+'_offDate');if(off&&!offDate)return alert('Ao marcar o serviço como Desligado, a data de desligamento é obrigatória.');d.utilities[k]={on:!off,onDate:v(k+'_onDate'),offDate,note:v(k+'_note'),lastBillAddress:v(k+'_last')}}}save();render();openDorm(id,t)}function masters(){view.innerHTML=`<div class="titlebar"><div><h1>Cadastros Mestres</h1><p>Cadastros organizados por área e por hierarquia.</p></div></div><section class="master-section"><h2>🏢 Cliente e Fábrica</h2><p class="muted">Cliente → Fábricas → Setores / 班</p><div class="master-items"><div class="master-item"><div><strong>Clientes e estrutura</strong><small>${db.clients.length} clientes · ${db.factories.length} fábricas · ${db.sectors.length} setores · ${db.shifts.length} 班</small></div><button class="btn primary" onclick="openClientHierarchy()">Gerenciar</button></div></div></section><section class="master-section"><h2>🏦 Bancos</h2><p class="muted">Banco → Agências</p><div class="master-items"><div class="master-item"><div><strong>Bancos e agências</strong><small>${db.banks.length} bancos · ${db.branches.length} agências</small></div><button class="btn primary" onclick="openBankHierarchy()">Gerenciar</button></div></div></section><section class="master-section"><h2>🏠 社宅</h2><div class="master-items"><div class="master-item"><div><strong>Imóveis</strong><small>${db.dorms.length} cadastrados</small></div><button class="btn" onclick="page='dorms';render()">Abrir 社宅管理</button></div></div></section><section class="master-section"><h2>📄 Documentos</h2><div class="master-items"><div class="master-item"><div><strong>Tipos de documento</strong><small>${db.docTypes.length} cadastrados</small></div><button class="btn primary" onclick="masterList('docType')">Gerenciar</button></div></div></section>`}function openClientHierarchy(){openDrawer('🏢 Clientes e Fábricas');drawerBody.innerHTML=db.clients.map(c=>`<div class="hier-card"><div class="hier-title"><div><b>${c.name}</b><div class="muted">${db.factories.filter(f=>f.clientId===c.id).length} fábrica(s)</div></div><button class="btn mini" onclick="editMaster('client','${c.id}')">Editar cliente</button></div><div class="hier-sub">${db.factories.filter(f=>f.clientId===c.id).map(f=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${f.name}</b> ${f.code?`<span class="chip">${f.code}</span>`:''}<div><small class="muted">Setores</small><div>${db.sectors.filter(s=>s.factoryId===f.id).map(s=>`<span class="chip">${s.name}</span>`).join('')||'<span class="muted">Nenhum</span>'}</div></div><div style="margin-top:6px"><small class="muted">班 / Turnos</small><div>${db.shifts.filter(s=>s.factoryId===f.id).map(s=>`<span class="chip">${s.name}</span>`).join('')||'<span class="muted">Nenhum</span>'}</div></div><div class="hier-actions"><button class="btn mini" onclick="editMaster('factory','${f.id}')">Editar fábrica</button><button class="btn mini" onclick="editMaster('sector','','${f.id}')">+ Setor</button><button class="btn mini" onclick="editMaster('shift','','${f.id}')">+ 班</button></div></div>`).join('')||'<p class="muted">Nenhuma fábrica.</p>'}<div class="hier-actions"><button class="btn" onclick="editMaster('factory','','${c.id}')">+ Nova fábrica</button></div></div></div>`).join('')||'<p class="muted">Nenhum cliente.</p>';drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="editMaster('client','')">+ Novo cliente</button>`}function openBankHierarchy(){openDrawer('🏦 Bancos');drawerBody.innerHTML=db.banks.map(b=>`<div class="hier-card"><div class="hier-title"><div><b>${b.name}</b><div class="muted">Código ${b.code||'—'}</div></div><button class="btn mini" onclick="editMaster('bank','${b.id}')">Editar banco</button></div><div class="hier-sub">${db.branches.filter(x=>x.bankId===b.id).map(a=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${a.name}</b><div class="muted">店番 ${a.code||'—'}</div></div><button class="btn mini" onclick="editMaster('branch','${a.id}')">Editar</button></div>`).join('')||'<p class="muted">Nenhuma agência.</p>'}<div class="hier-actions"><button class="btn" onclick="editMaster('branch','','${b.id}')">+ Nova agência</button></div></div></div>`).join('')||'<p class="muted">Nenhum banco.</p>';drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="editMaster('bank','')">+ Novo banco</button>`}function masterList(type){if(type==='docType'){openDrawer('Tipos de documento');drawerBody.innerHTML=db.docTypes.map(x=>`<div class="panel"><b>${x.ja}</b><div class="muted">${x.pt}</div></div>`).join('');drawerFoot.innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="editMaster('docType','')">+ Novo</button>`}}function editMaster(type,id,parent=''){const map={client:['Cliente','clients'],factory:['Fábrica','factories'],sector:['Setor','sectors'],shift:['班','shifts'],bank:['Banco','banks'],branch:['Agência','branches'],docType:['Tipo de documento','docTypes']};const [title,key]=map[type],x=by(db[key],id)||{};openDrawer((id?'Editar ':'Novo ')+title);let extra='';if(type==='factory')extra=`<div class="field"><label>Cliente</label><select id="m_parent">${db.clients.map(c=>`<option value="${c.id}" ${(x.clientId||parent)===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Código curto</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='sector'||type==='shift')extra=`<div class="field"><label>Fábrica</label><select id="m_parent">${db.factories.map(f=>`<option value="${f.id}" ${(x.factoryId||parent)===f.id?'selected':''}>${f.name}</option>`).join('')}</select></div>`;if(type==='branch')extra=`<div class="field"><label>Banco</label><select id="m_parent">${db.banks.map(b=>`<option value="${b.id}" ${(x.bankId||parent)===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label>店番</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='bank')extra=`<div class="field"><label>Código</label><input id="m_code" value="${x.code||''}"></div>`;if(type==='docType')drawerBody.innerHTML=`<div class="field"><label>日本語</label><input id="m_name" value="${x.ja||''}"></div><div class="field"><label>Português</label><input id="m_pt" value="${x.pt||''}"></div>`;else drawerBody.innerHTML=`<div class="field"><label>Nome</label><input id="m_name" value="${x.name||''}"></div>${extra}`;drawerFoot.innerHTML=`<button class="btn" onclick="page='masters';render();closeDrawer()">Cancelar</button><button class="btn primary" onclick="saveMaster('${type}','${id}')">Salvar</button>`}function saveMaster(type,id){const map={client:'clients',factory:'factories',sector:'sectors',shift:'shifts',bank:'banks',branch:'branches',docType:'docTypes'},key=map[type];const x=by(db[key],id)||{id:uid(type)};if(type==='docType'){x.ja=v('m_name');x.pt=v('m_pt')}else x.name=v('m_name');if(type==='factory'){x.clientId=v('m_parent');x.code=v('m_code')}if(type==='sector'||type==='shift')x.factoryId=v('m_parent');if(type==='bank')x.code=v('m_code');if(type==='branch'){x.bankId=v('m_parent');x.code=v('m_code')}if(!id)db[key].push(x);save();closeDrawer();render();if(['client','factory','sector','shift'].includes(type))openClientHierarchy();if(['bank','branch'].includes(type))openBankHierarchy()}render();</script></body></html>
