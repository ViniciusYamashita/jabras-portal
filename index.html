    .jn-lang{position:relative;display:inline-flex;align-items:center}
    .jn-lang-btn{height:40px;min-width:126px;border:1px solid #dbe5f0;border-radius:10px;background:#fff;color:#15314f;padding:0 11px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 12px Inter,sans-serif;cursor:pointer;box-shadow:0 2px 7px rgba(15,42,77,.04);transition:.18s ease}
    .jn-lang-btn:hover{border-color:#b9cce2;box-shadow:0 6px 16px rgba(15,42,77,.08)}
    .jn-lang-btn[aria-expanded="true"]{border-color:#7aa7e8;box-shadow:0 0 0 3px rgba(29,101,216,.10)}
    .jn-lang-menu{position:absolute;right:0;top:48px;width:205px;padding:7px;background:#fff;border:1px solid #dbe5f0;border-radius:13px;box-shadow:0 18px 42px rgba(7,27,51,.18);z-index:9999;animation:langIn .16s ease-out}
    .jn-lang-menu[hidden]{display:none!important}
    .jn-lang-opt{width:100%;min-height:42px;border:0;background:transparent;border-radius:9px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:#24384e;font:600 12px Inter,sans-serif;cursor:pointer;text-align:left}
    .jn-lang-opt:hover{background:#f3f7fc;color:#0f4ea8}
    .jn-lang-opt.active{background:#eaf2ff;color:#145bbf}
    .jn-lang-opt.active::after{content:'✓';width:22px;height:22px;border-radius:7px;background:#1d65d8;color:#fff;display:grid;place-items:center;font-size:11px}
    @keyframes langIn{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:900px){.jn-lang-btn{min-width:42px;width:42px;padding:0;font-size:0}.jn-lang-btn::before{content:'🌐';font-size:15px}.jn-lang-menu{right:-4px}}
