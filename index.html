<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabras Neo — Homologação V1</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="homologacao-v1.html"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;
const style=d.createElement('style');style.textContent=`
.drawer{width:78vw!important;max-width:78vw!important;min-width:0!important}
.drawerHead,.drawerBody,.drawerFoot,.tabs{width:100%;max-width:100%;min-width:0}
.drawerBody{overflow-x:hidden!important}
.tabs{overflow-x:auto!important;overflow-y:hidden;scrollbar-width:thin}
.tabs button{flex:0 0 auto}
.panel{max-width:100%;min-width:0;overflow:hidden}
.grid2,.grid3{width:100%;max-width:100%;min-width:0}
.field{min-width:0}.field input,.field select,.field textarea{max-width:100%;min-width:0}
.utility-status{display:flex;gap:18px;align-items:center;padding:8px 0 14px}.utility-status label{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer}.required-note{font-size:12px;color:#c84343;margin-top:-6px;margin-bottom:10px}
@media(max-width:900px){.drawer{width:100vw!important;max-width:100vw!important}.grid2,.grid3{grid-template-columns:1fr!important}}
`;d.head.appendChild(style);
const oldOpenDorm=w.openDorm;
w.openDorm=function(id,tab='dados'){
 oldOpenDorm(id,tab);
 if(tab!=='serv')return;
 const dorm=w.db.dorms.find(x=>x.id===id);
 ['electric','gas','water'].forEach(k=>{const u=dorm.utilities[k]||{},on=d.getElementById(k+'_on');if(!on)return;
 const parent=on.parentElement;const status=u.on!==false?'on':'off';
 parent.outerHTML=`<div class="utility-status"><label><input type="radio" name="${k}_status" id="${k}_status_on" value="on" ${status==='on'?'checked':''} onchange="toggleUtilityStatus('${k}')"> Ligado</label><label><input type="radio" name="${k}_status" id="${k}_status_off" value="off" ${status==='off'?'checked':''} onchange="toggleUtilityStatus('${k}')"> Desligado</label></div>`;
 });
 w.toggleUtilityStatus=function(k){const off=d.getElementById(k+'_status_off')?.checked,offDate=d.getElementById(k+'_offDate');if(offDate){offDate.required=!!off;offDate.style.borderColor=off&&!offDate.value?'#c84343':''} };
 ['electric','gas','water'].forEach(k=>w.toggleUtilityStatus(k));
 d.getElementById('drawerFoot').innerHTML=`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn primary" onclick="saveDormV2('${id}','serv')">Salvar</button>`;
 };
 w.saveDormV2=function(id,t){const dorm=w.db.dorms.find(x=>x.id===id);if(t==='serv'){
 for(const k of ['electric','gas','water']){const off=d.getElementById(k+'_status_off')?.checked,offDate=d.getElementById(k+'_offDate')?.value||'';if(off&&!offDate){alert('Ao marcar '+(k==='electric'?'電気':k==='gas'?'ガス':'水道')+' como Desligado, a data de desligamento é obrigatória.');d.getElementById(k+'_offDate')?.focus();return}dorm.utilities[k]={on:!off,onDate:d.getElementById(k+'_onDate')?.value||'',offDate:offDate,note:d.getElementById(k+'_note')?.value||'',lastBillAddress:d.getElementById(k+'_last')?.value||''};}
 w.save();w.openDorm(id,'serv');w.render();return;}w.saveDorm(id,t)};
});
</script></body></html>
